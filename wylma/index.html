<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500;1,600;1,700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<style>
/* Layout: app de celular numa coluna (até 520px), claro e delicado como a marca da Wylma: lilás, ameixa e rosa-blush; títulos em itálico serifado, nome em letra cursiva, barra de abas fixa embaixo. */
:root{
  --bg:#fbf6fa; --sup:#ffffff; --sup2:#f6edf5; --linha:#ecdcea; --tinta:#2f1a36; --suave:#836f88;
  --ameixa:#6b2f7a; --ameixa-esc:#4d1f59; --lilas:#a46bb5; --rosa:#e7a9c8; --blush:#fcecf4;
  --ok:#2f8a5b; --ok-bg:#e3f4ea; --aviso:#9a6400; --aviso-bg:#fdf0d6; --alerta:#bd3a53; --alerta-bg:#fce6ea;
  --cursiva:"Great Vibes","Brush Script MT",cursive;
  --titulo:"Cormorant Garamond","Georgia",serif;
  --corpo:"Nunito Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--tinta);font:15px/1.5 var(--corpo);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--lilas);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);border-inline:1px solid var(--linha)}
@media (max-width:540px){.app{border-inline:0}}

/* Cabeçalho */
.topo{padding:14px 16px 16px;background:radial-gradient(120% 120% at 100% 0%,#f3d9ea 0%,#f7ecf5 45%,var(--bg) 100%);position:relative;overflow:hidden}
.topo::after{content:"";position:absolute;right:-60px;top:-70px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(164,107,181,.22),transparent 70%);pointer-events:none}
.demo{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;position:relative;z-index:1}
.demo small{font:700 10.5px/1 var(--corpo);letter-spacing:.16em;text-transform:uppercase;color:var(--suave)}
.troca{display:flex;background:rgba(255,255,255,.7);border:1px solid var(--linha);border-radius:99px;padding:3px}
.troca button{border:0;background:none;padding:6px 12px;border-radius:99px;font:700 13px/1 var(--corpo);color:var(--suave)}
.troca button[aria-pressed="true"]{background:var(--ameixa);color:#fff}
.marca{display:flex;flex-direction:column;align-items:flex-start;position:relative;z-index:1}
.marca .w{font:400 52px/0.95 var(--cursiva);color:var(--ameixa)}
.marca .e{font:700 11.5px/1 var(--corpo);letter-spacing:.42em;text-transform:uppercase;color:var(--lilas);margin:14px 0 0 6px}

main{flex:1;padding:18px 16px 24px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font:italic 700 30px/1.05 var(--titulo);color:var(--ameixa-esc)}
h2{font:800 11.5px/1 var(--corpo);letter-spacing:.14em;text-transform:uppercase;color:var(--suave)}
p{margin:0}
.suave{color:var(--suave)}
.bloco{display:flex;flex-direction:column;gap:10px}
.cartao{background:var(--sup);border:1px solid var(--linha);border-radius:18px;padding:15px;box-shadow:0 1px 2px rgba(107,47,122,.04),0 8px 24px rgba(107,47,122,.05)}
.linha{display:flex;align-items:center;gap:10px;justify-content:space-between}
.num{font-variant-numeric:tabular-nums}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--linha);background:var(--sup);border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px;line-height:1;color:var(--tinta)}
.btn.pri{background:var(--ameixa);border-color:var(--ameixa);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.cheio{width:100%;padding:14px}
.btn.peq{padding:7px 11px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.acoes{display:flex;flex-wrap:wrap;gap:8px}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--linha);background:var(--sup);border-radius:99px;padding:8px 13px;font-weight:700;font-size:13.5px;line-height:1;white-space:nowrap;color:var(--tinta)}
.chip[aria-pressed="true"]{background:var(--ameixa);color:#fff;border-color:var(--ameixa)}
@media (hover:hover) and (pointer:fine){.chips{flex-wrap:wrap;overflow:visible}}

.st{display:inline-flex;align-items:center;gap:5px;font:800 11px/1 var(--corpo);letter-spacing:.05em;text-transform:uppercase;padding:5px 8px;border-radius:99px;white-space:nowrap}
.st.agendado{border:1px solid var(--linha);color:var(--suave)}
.st.chegou{background:var(--aviso-bg);color:var(--aviso)}
.st.atendendo{background:var(--ameixa);color:#fff}
.st.pago{background:var(--ok-bg);color:var(--ok)}
.st.faltou,.st.cancelado{color:var(--suave);text-decoration:line-through}
.st.pac{background:var(--blush);color:var(--ameixa)}
.st.atraso{background:var(--aviso-bg);color:var(--aviso)}
.st.alerta{background:var(--alerta-bg);color:var(--alerta);text-transform:none;letter-spacing:0;font-size:12px}

/* Cliente */
.ola{font:400 40px/1 var(--cursiva);color:var(--ameixa)}
.prox{background:linear-gradient(150deg,var(--ameixa),#8d4a9c 60%,#b0679f);color:#fff;border-radius:20px;padding:17px;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 30px rgba(107,47,122,.25)}
.prox h2{color:rgba(255,255,255,.75)}
.prox .quando{font:italic 700 38px/1 var(--titulo)}
.prox .quando span{font:700 15px/1 var(--corpo);opacity:.8;margin-left:8px;font-style:normal}
.prox .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff}
.promo{border-radius:20px;overflow:hidden;background:var(--sup);border:1px solid var(--linha);box-shadow:0 8px 24px rgba(107,47,122,.08)}
.promo img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;max-width:100%}
.promo .txt{padding:14px;display:flex;flex-direction:column;gap:10px}
.promo .tag{align-self:flex-start;font:800 10.5px/1 var(--corpo);letter-spacing:.14em;text-transform:uppercase;color:var(--ameixa);background:var(--blush);padding:6px 9px;border-radius:99px}
.aviso-cli{display:flex;gap:12px;align-items:center;background:var(--blush);border:1px solid #f3cfe2;border-radius:16px;padding:13px 14px}
.aviso-cli .ic{flex:none;width:38px;height:38px;border-radius:12px;background:#fff;display:grid;place-items:center;color:var(--ameixa)}
.aviso-cli .ic svg{width:20px;height:20px}
.aviso-cli p{flex:1;min-width:0;font-size:14px;line-height:1.35}
.bolinhas{display:flex;gap:6px;flex-wrap:wrap}
.bolinhas i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--rosa);display:block}
.bolinhas i.ok{background:linear-gradient(135deg,var(--lilas),var(--ameixa));border-color:var(--ameixa)}

.lista{display:flex;flex-direction:column;gap:8px}
.op{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;width:100%;background:var(--sup);border:1px solid var(--linha);border-radius:14px;padding:12px 14px}
.op[aria-pressed="true"]{border-color:var(--ameixa);box-shadow:inset 0 0 0 1px var(--ameixa);background:#fdf8fc}
.op b{display:block;font-size:15px}
.op small{color:var(--suave);font-size:13px}
.op .preco{font:800 15px/1 var(--corpo);white-space:nowrap;color:var(--ameixa-esc)}
.op .preco small{display:block;font-size:11px;font-weight:600;text-align:right}
.horas{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hora{border:1px solid var(--linha);background:var(--sup);border-radius:12px;padding:11px 0;font:800 15px/1 var(--corpo);font-variant-numeric:tabular-nums}
.hora[aria-pressed="true"]{background:var(--ameixa);border-color:var(--ameixa);color:#fff}
.dia{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:58px;padding:9px 10px;border-radius:14px}
.dia small{font:800 10.5px/1 var(--corpo);letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.dia b{font:italic 700 22px/1 var(--titulo)}
.resumo{position:sticky;bottom:72px;background:#fff;border:1px solid var(--linha);border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center;justify-content:space-between;box-shadow:0 -10px 30px rgba(107,47,122,.12)}
.resumo p{font-size:13.5px;line-height:1.35;min-width:0}
.brinde{color:var(--ok);font-weight:800}

/* Equipe */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--sup);border:1px solid var(--linha);border-radius:14px;padding:12px 10px}
.kpi small{display:block;font:800 10.5px/1.2 var(--corpo);letter-spacing:.1em;text-transform:uppercase;color:var(--suave)}
.kpi b{display:block;font:italic 700 24px/1.1 var(--titulo);color:var(--ameixa-esc);font-variant-numeric:tabular-nums;margin-top:6px}
.kpi{min-width:0}
.at .q .linha{flex-wrap:wrap;row-gap:4px}
@media (max-width:330px){.demo small{font-size:9px;letter-spacing:.08em}.troca button{padding:6px 9px;font-size:12px}main{padding-inline:12px}}
@media (max-width:380px){.kpi{padding:10px 8px}.kpi b{font-size:19px}.kpi small{font-size:9.5px;letter-spacing:.06em}}
.aviso{display:flex;gap:10px;align-items:flex-start;background:var(--sup);border:1px solid var(--linha);border-left:3px solid var(--lilas);border-radius:12px;padding:11px 12px;font-size:14px}
.aviso .x{margin-left:auto;background:none;border:0;color:var(--ameixa);font-weight:800;font-size:13px;white-space:nowrap}
.fila{display:flex;flex-direction:column;gap:8px}
.at{display:grid;grid-template-columns:56px 1fr;gap:12px;background:var(--sup);border:1px solid var(--linha);border-radius:14px;padding:12px}
.at.feito{opacity:.6}
.at .h{font:italic 700 20px/1 var(--titulo);color:var(--ameixa-esc);font-variant-numeric:tabular-nums;padding-top:2px}
.at .h small{display:block;font:700 12px/1 var(--corpo);color:var(--suave);margin-top:5px;font-style:normal}
.at .q{display:flex;flex-direction:column;gap:6px;min-width:0}
.at .q b{font-size:15.5px}
.at .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--suave)}
.prof{display:inline-flex;align-items:center;gap:6px}
.prof i{width:8px;height:8px;border-radius:50%}
.grade{display:grid;gap:4px;align-items:stretch}
.grade .hh{font:700 12px/1 var(--corpo);color:var(--suave);padding-top:6px;font-variant-numeric:tabular-nums}
.grade .cab{font:800 12px/1 var(--corpo);letter-spacing:.08em;text-transform:uppercase;text-align:center;padding:6px 0}
.livre{border:1px dashed var(--linha);border-radius:10px;background:none;color:var(--suave);font-size:12px;min-height:40px}
.livre:hover{border-color:var(--lilas);color:var(--ameixa)}
.bloc{border-radius:10px;padding:6px 8px;background:var(--blush);border:0;border-left:3px solid var(--lilas);font-size:12.5px;line-height:1.25;overflow:hidden;min-height:40px;text-align:left}
.bloc b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bloc.pago{border-left-color:var(--ok);background:#f2faf5}.bloc.atendendo{border-left-color:var(--ameixa)}.bloc.chegou{border-left-color:var(--aviso)}
.bloqueado{border-radius:10px;min-height:40px;display:grid;place-items:center;font-size:11.5px;color:var(--suave);background:repeating-linear-gradient(-45deg,var(--sup) 0 6px,var(--sup2) 6px 12px)}
.barras{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:6px}
.barras i{flex:1;background:linear-gradient(180deg,var(--lilas),var(--ameixa));border-radius:4px 4px 0 0;min-height:2px;opacity:.85}
.barras i.hoje{background:var(--rosa)}
.tab{width:100%;border-collapse:collapse;font-size:14px}
.tab td{padding:9px 0;border-bottom:1px solid var(--linha);vertical-align:top}
.tab td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.tab tr:last-child td{border-bottom:0}
.busca{width:100%;background:var(--sup);border:1px solid var(--linha);border-radius:14px;padding:12px 14px;color:var(--tinta);font:inherit}
.cli{display:flex;align-items:center;gap:12px;background:var(--sup);border:1px solid var(--linha);border-radius:14px;padding:11px 12px}
.av{flex:none;width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--blush),#f1d3e6);display:grid;place-items:center;font:italic 700 17px/1 var(--titulo);color:var(--ameixa)}
.cli .q{flex:1;min-width:0}
.cli .q b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cli .q small{color:var(--suave);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.hsel{background:var(--sup);border:1px solid var(--linha);border-radius:8px;padding:6px 4px;color:var(--tinta);font:700 14px/1 var(--corpo);font-variant-numeric:tabular-nums}
.marcar{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.35}
.marcar input{width:20px;height:20px;accent-color:var(--ameixa);flex:none;margin:0}
.fotos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fotos figure{margin:0;display:flex;flex-direction:column;gap:4px}
.fotos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;max-width:100%;border:1px solid var(--linha)}
.fotos figcaption{font:800 10.5px/1 var(--corpo);letter-spacing:.12em;text-transform:uppercase;color:var(--suave);text-align:center}
.foto-unica{width:100%;border-radius:14px;max-width:100%;border:1px solid var(--linha)}
.sobe{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;aspect-ratio:1;border:1.5px dashed var(--rosa);border-radius:12px;background:var(--blush);color:var(--ameixa);font-weight:800;font-size:13px;cursor:pointer;text-align:center;padding:8px}
.sobe input{position:absolute;width:1px;height:1px;opacity:0}

.abas{position:sticky;bottom:0;display:grid;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-top:1px solid var(--linha);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.abas button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;font:700 11px/1 var(--corpo);color:var(--suave);border-radius:12px}
.abas button svg{width:22px;height:22px}
.abas button{min-width:0;overflow:hidden}
.abas button span{display:block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:380px){.abas{padding-inline:2px}.abas button{font-size:9.5px;gap:3px;padding:6px 0}.abas button svg{width:20px;height:20px}}
.abas button[aria-current="page"]{color:var(--ameixa)}
.abas button[aria-current="page"] svg{color:var(--ameixa)}

.fundo-modal{position:fixed;inset:0;background:rgba(47,26,54,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal{width:100%;max-width:520px;max-height:90vh;overflow:auto;background:var(--sup);border-radius:22px 22px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.modal h3{font:italic 700 26px/1.1 var(--titulo);color:var(--ameixa-esc)}
.zap{background:#efeae2;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.zap .bal{align-self:flex-end;background:#d9fdd3;color:#111b21;border-radius:10px 10px 2px 10px;padding:9px 11px;font-size:14px;max-width:92%;white-space:pre-wrap}
.campo{display:flex;flex-direction:column;gap:6px}
.campo label{font:800 11px/1 var(--corpo);letter-spacing:.1em;text-transform:uppercase;color:var(--suave)}
.campo select,.campo input,.campo textarea{background:var(--sup);border:1px solid var(--linha);border-radius:12px;padding:11px 12px;color:var(--tinta);font:inherit}
.campo textarea{min-height:70px;resize:vertical}
.qtd{display:flex;align-items:center;gap:10px}
.qtd button{width:32px;height:32px;border-radius:10px;border:1px solid var(--linha);background:var(--sup);font-weight:800}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--linha);padding-top:12px}
.total b{font:italic 700 32px/1 var(--titulo);color:var(--ameixa-esc);font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ameixa-esc);color:#fff;font-weight:700;font-size:14px;padding:11px 16px;border-radius:14px;z-index:30;box-shadow:0 10px 30px rgba(47,26,54,.3);max-width:calc(100% - 32px);text-align:center}
.rodape{font-size:12px;color:var(--suave);text-align:center;padding:4px 16px 14px}
.rodape button{background:none;border:0;color:var(--suave);text-decoration:underline;font-size:12px}
.kpi b,.at .h,.prox .quando,.total b,.dia b{font-variant-numeric:lining-nums tabular-nums}
.pe-modal{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));margin:0 -16px calc(-18px - env(safe-area-inset-bottom,0px));padding:4px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--sup);display:flex;flex-direction:column;gap:10px;box-shadow:0 -10px 24px rgba(107,47,122,.10);z-index:2}
.pe-modal .total{padding-top:10px}
.campo label.sobe{font:800 13px/1.3 var(--corpo);letter-spacing:0;text-transform:none;color:var(--ameixa)}
.campo label.sobe span{text-transform:none;letter-spacing:0}
.camp-topo{display:flex;gap:12px;align-items:flex-start;background:linear-gradient(150deg,#fff,var(--blush));border:1px solid #f3cfe2;border-radius:18px;padding:12px}
.camp-topo img{width:88px;height:88px;object-fit:cover;border-radius:12px;flex:none}
.camp-topo>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.camp-topo .tag{align-self:flex-start;font:800 10.5px/1 var(--corpo);letter-spacing:.14em;text-transform:uppercase;color:var(--ameixa);background:#fff;padding:5px 8px;border-radius:99px}
.camp-topo b{font:italic 700 22px/1.1 var(--titulo);color:var(--ameixa-esc)}
.camp-topo p{font-size:14px;line-height:1.4}
[hidden]{display:none!important}
.vazio{text-align:center;color:var(--suave);padding:20px 10px;border:1px dashed var(--linha);border-radius:14px}
@media (prefers-reduced-motion:no-preference){.st.atendendo{animation:pulsa 1.6s ease-in-out infinite}}
@keyframes pulsa{50%{opacity:.65}}
/* v2: nada se sobrepõe — linhas e grupos de botões quebram quando falta espaço */
.linha{flex-wrap:wrap;row-gap:8px}
.linha>*{min-width:0}
.acoes{flex-wrap:wrap}
.acoes>.btn{flex:0 1 auto}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.chips.quebra{flex-wrap:wrap;overflow:visible}

.btn-aj{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--linha);background:rgba(255,255,255,.75);border-radius:12px;padding:8px 11px;font:700 13px/1 var(--corpo);color:var(--ameixa)}
.btn-aj svg{width:18px;height:18px}

.ic-mini svg{width:18px;height:18px}
.feed{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.sugs{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.sug{display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;border:1px solid var(--linha);background:var(--blush);border-radius:14px;padding:10px 12px;color:var(--tinta)}
.sug b{font:italic 700 18px/1 var(--titulo);color:var(--ameixa-esc)}
.sug span{font-size:13px;color:var(--suave);font-weight:700}
.indica{background:linear-gradient(150deg,#fff,var(--blush));border:1px solid #f3cfe2;border-radius:18px;padding:15px;display:flex;flex-direction:column;gap:10px}
.pac-op{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--sup);border:1px solid var(--linha);border-radius:14px;padding:12px 14px}

.pac-op b{display:block}
.pac-op small{color:var(--suave);font-size:13px}
.cli{flex-wrap:wrap}
.cli>.acoes{margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.camp{display:flex;gap:12px;background:var(--sup);border:1px solid var(--linha);border-radius:16px;padding:10px}
.camp img{width:84px;height:84px;object-fit:cover;border-radius:12px;flex:none}
.camp .q{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.camp small{color:var(--suave);font-size:12.5px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.trabalhos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.trab{background:var(--sup);border:1px solid var(--linha);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px}
.trab img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
.trab small{color:var(--suave);font-size:12px}
.horario{display:inline-flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-items:center}
.aviso{flex-wrap:wrap}
.aviso>span{flex:1;min-width:160px}
.aviso.urgente{border-left-color:var(--alerta);background:var(--alerta-bg)}
.st.ok-f{background:var(--ok-bg);color:var(--ok)}
.sobe span{color:var(--suave);font-weight:600;font-size:12px}
.sobe.larga{aspect-ratio:auto;min-height:110px}
.btn.mini{padding:3px 7px;font-size:11px;border-radius:8px}
.fotos{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}

.resumo p{flex:1;min-width:150px}
.tab td:first-child{padding-right:10px}
@media (max-width:400px){.cli>.acoes{width:100%;padding-left:0}.cli>.acoes .btn{flex:1}}

<body>


<div class="app">
  <header class="topo">
    <div class="demo">
      <small>Demonstração</small>
      <div class="troca" role="group" aria-label="Ver como">
        <button type="button" id="modoCliente" data-modo="cliente">Cliente</button>
        <button type="button" id="modoDono" data-modo="dono">Espaço</button>
      </div>
    </div>
    <div class="marca-linha">
      <div class="marca"><span class="w">Wylma</span><span class="e">Espaço Mulher</span></div>
      <button type="button" class="btn-aj" id="btnAjustes" data-aba-dono="ajustes" hidden aria-label="Ajustes do espaço"></button>
    </div>
  </header>
  <main id="tela"></main>
  <p class="rodape">Dados de exemplo · sistema <b>Torque</b> · <button type="button" id="recomecar">Recomeçar demonstração</button></p>
  <nav class="abas" id="abas" aria-label="Seções"></nav>
</div>
<div id="camada"></div>

<script>
(function(){
'use strict';
const IMG_PROMO='promo.jpg', IMG_LABIOS='labios.jpg';
/* ---------- utilidades ---------- */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const deYmd=s=>{const[a,m,d]=s.split('-').map(Number);return new Date(a,m-1,d)};
const somaDias=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const paraMin=h=>{const[a,b]=h.split(':').map(Number);return a*60+b};
const paraHora=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const brl=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const brl0=v=>brl(v).replace(/,00$/,'');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'],DSL=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const hojeD=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const HOJE=ymd(hojeD());
function rotDia(s){const d=deYmd(s),dif=Math.round((d-hojeD())/864e5);
  if(dif===0)return'Hoje';if(dif===1)return'Amanhã';if(dif===-1)return'Ontem';return DS[d.getDay()]+', '+d.getDate()+' '+MES[d.getMonth()]}
const dataCurta=s=>{const d=deYmd(s);return pad(d.getDate())+'/'+MES[d.getMonth()]};
const diasDesde=s=>Math.round((hojeD()-deYmd(s))/864e5);
const primeiro=n=>n.split(' ')[0];
const iniciais=n=>n.split(' ').map(p=>p[0]).slice(0,2).join('');
function semente(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const copia=o=>JSON.parse(JSON.stringify(o));
const novoId=p=>p+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);

/* ---------- catálogo de exemplo (a Wylma muda tudo em Ajustes) ---------- */
const CATS=['Cabelo','Depilação','Estética','Maquiagem'];
const CUID_CERA='Evite sol, piscina e academia por 24 horas. Não use desodorante com álcool nas axilas no mesmo dia. Esfolie a pele 2 vezes por semana para evitar pelos encravados.';
const DEF_SERV=[
 {id:'progressiva',cat:'Cabelo',nome:'Progressiva',min:180,preco:180,apartir:true,retorno:90,cuidados:'Não prenda nem molhe o cabelo por 72 horas. Use shampoo sem sal e evite piscina e mar por 15 dias.'},
 {id:'escova',cat:'Cabelo',nome:'Escova modelada',min:60,preco:50},
 {id:'hidratacao',cat:'Cabelo',nome:'Hidratação profunda',min:60,preco:60,retorno:15,cuidados:'Prefira água morna e finalize com o leave-in indicado. Evite chapinha muito quente nos próximos dias.'},
 {id:'buco',cat:'Depilação',nome:'Buço',min:30,preco:15,retorno:21,cuidados:CUID_CERA},
 {id:'axilas',cat:'Depilação',nome:'Axilas',min:30,preco:25,retorno:28,cuidados:CUID_CERA},
 {id:'virilha',cat:'Depilação',nome:'Virilha',min:30,preco:50,retorno:28,cuidados:CUID_CERA},
 {id:'perna',cat:'Depilação',nome:'Perna inteira',min:60,preco:70,retorno:30,cuidados:CUID_CERA},
 {id:'gloss',cat:'Estética',nome:'Nutri Gloss labial',min:60,preco:120,retorno:45,destaque:'Queridinho',cuidados:'Nas primeiras 24 horas, evite batom, alimentos muito quentes e beijos demorados. Hidrate os lábios várias vezes ao dia.'},
 {id:'clareamento',cat:'Estética',nome:'Clareamento de axilas ou íntima',min:60,preco:80,retorno:7,cuidados:'Evite roupas apertadas e desodorante no dia. Use o hidratante calmante indicado à noite. Ardência leve é normal nas primeiras horas.'},
 {id:'spa',cat:'Estética',nome:'Spa dos pés',min:60,preco:70,retorno:30},
 {id:'massagem',cat:'Estética',nome:'Massagem relaxante',min:60,preco:100,cuidados:'Beba bastante água ao longo do dia e evite banho muito quente logo depois.'},
 {id:'make',cat:'Maquiagem',nome:'Maquiagem social',min:60,preco:120},
 {id:'noiva',cat:'Maquiagem',nome:'Maquiagem de noiva',min:120,preco:350,apartir:true}
];
const DEF_PROF=[{id:'wylma',nome:'Wylma',cor:'#6b2f7a',com:0},{id:'carla',nome:'Carla',cor:'#d0739b',com:40}];
const CORES_PROF=['#4f8fbf','#2f8a5b','#c98a1c','#8a5cc0'];
const DEF_PAC=[
 {id:'p-clar',nome:'Clareamento · 5 sessões',serv:'clareamento',sessoes:5,preco:350},
 {id:'p-gloss',nome:'Nutri Gloss · 3 sessões',serv:'gloss',sessoes:3,preco:320},
 {id:'p-mass',nome:'Massagem · 4 sessões',serv:'massagem',sessoes:4,preco:360}
];
const EXTRAS=[{id:'kit',nome:'Kit home care',preco:89},{id:'labial',nome:'Hidratante labial',preco:35}];
const DEF_EXP=[null,[540,1140],[540,1140],[540,1140],[540,1140],[540,1140],[480,960]];
const DEF_CAMP=[{id:'cp1',titulo:'Liberte-se',texto:'Agende sua depilação com cera e ganhe uma sessão de clareamento das axilas ou íntima.',img:'@promo',cat:'Depilação',brindeTipo:'sessao',brinde:'clareamento',regra:'tipo',ativa:true,criada:null}];
const DEF_INDIC={ativo:true,tipo:'credito',valor:20,serv:'hidratacao',limiteMes:3};
const PASSO=30, INSTAGRAM='@wylmaespacomulher';
let SERV,PROF,PACS,EXP,CAMP,INDIC;
function expediente(d){const e=EXP[d.getDay()];return e?e.slice():null}
const sv=id=>SERV.find(s=>s.id===id);
const pf=id=>PROF.find(b=>b.id===id);
const pc=id=>PACS.find(p=>p.id===id);
const servAtivos=()=>SERV.filter(s=>s.ativo!==false);
/* várias campanhas podem ficar no ar juntas; a de brinde vale para o tipo de serviço dela */
const campanhasAtivas=()=>CAMP.filter(c=>c.ativa);
/* brinde da campanha: 1 sessão de um serviço, desconto em % no procedimento agendado ou produto de presente.
   Vale para qualquer procedimento do tipo da campanha, ou só para o serviço em destaque (regra 'servico'). */
const tipoBrinde=c=>c.brindeTipo||(c.brinde?'sessao':'');
const temBrinde=c=>{const t=tipoBrinde(c);return t==='sessao'?!!(c.brinde&&sv(c.brinde)):t==='desconto'?c.pct>0:t==='produto'?!!EXTRAS.find(x=>x.id===c.prod):false};
function textoBrinde(c){const t=tipoBrinde(c);return t==='sessao'?'1 sessão de '+sv(c.brinde).nome.toLowerCase():t==='desconto'?c.pct+'% de desconto no procedimento':t==='produto'?EXTRAS.find(x=>x.id===c.prod).nome.toLowerCase()+' de presente':''}
const alvoBrinde=c=>c.regra==='servico'&&c.serv&&sv(c.serv)?sv(c.serv).nome.toLowerCase():c.cat?c.cat.toLowerCase():'qualquer procedimento';
const campanhasDoServ=s=>CAMP.filter(c=>c.ativa&&temBrinde(c)&&(!c.cat||c.cat===s.cat)&&(c.regra!=='servico'||c.serv===s.id));
const imgSrc=f=>f==='@labios'?IMG_LABIOS:f==='@promo'?IMG_PROMO:f;
const textoBeneficio=()=>INDIC.tipo==='credito'?brl0(INDIC.valor)+' de crédito':'1 sessão de '+sv(INDIC.serv).nome.toLowerCase();

/* ---------- dados de exemplo ---------- */
const NOMES=['Ana Paula','Juliana','Camila','Fernanda','Patrícia','Larissa','Beatriz','Mariana','Aline','Vanessa','Débora','Letícia','Renata','Gabriela','Tatiane','Bruna','Isabela','Natália','Priscila','Jéssica','Carolina','Michele'];
let S;
function gerar(){
  SERV=copia(DEF_SERV);PROF=copia(DEF_PROF);PACS=copia(DEF_PAC);EXP=copia(DEF_EXP);CAMP=copia(DEF_CAMP);INDIC=copia(DEF_INDIC);CAMP[0].criada=HOJE;
  const R=semente(2026),sorteia=a=>a[Math.floor(R()*a.length)],mesHoje=pad(hojeD().getMonth()+1);
  const clientes=NOMES.map((n,i)=>({id:'c'+i,nome:n,fone:'(34) 9'+(8000+Math.floor(R()*1999))+'-'+(1000+Math.floor(R()*8999)),
    aniv:([3,7,12].includes(i)?mesHoje:pad(1+Math.floor(R()*12)))+'-'+pad(1+Math.floor(R()*27)),saude:null,divulga:false,pacotes:[],credito:0,indicadaPor:null,codigo:n.split(' ')[0].toUpperCase().normalize('NFD').replace(/[^A-Z]/g,'').slice(0,5)+(10+i)}));
  clientes[4].saude={alergia:'Alergia a cera de abelha',gestante:false,sensivel:true,diabetes:false,acidos:false,obs:'',em:HOJE};
  clientes[9].saude={alergia:'',gestante:true,sensivel:false,diabetes:false,acidos:false,obs:'5 meses',em:HOJE};
  clientes[0].divulga=true;
  clientes[0].pacotes.push({id:'k1',pac:'p-clar',nome:'Clareamento · 5 sessões',serv:'clareamento',sessoes:5,usadas:2,em:ymd(somaDias(hojeD(),-15))});
  [[6,'p-gloss',1],[11,'p-mass',2],[14,'p-clar',4],[17,'p-mass',0]].forEach(([i,p,u],n)=>{const P=DEF_PAC.find(x=>x.id===p);clientes[i].pacotes.push({id:'k'+(n+2),pac:p,nome:P.nome,serv:P.serv,sessoes:P.sessoes,usadas:u,em:ymd(somaDias(hojeD(),-10-n*6))})});
  // indicações: Carolina (concluiu, Ana ganhou crédito), Michele (agendou, ainda não concluiu), Priscila indicada pela Patrícia
  clientes[20].indicadaPor='c0';clientes[21].indicadaPor='c0';clientes[18].indicadaPor='c4';
  clientes[0].credito=20;clientes[4].credito=20;
  const ag=[],lanc=[];let seq=1;
  const livre=(prof,data,ini,dur)=>{const e=expediente(deYmd(data));if(!e||ini<e[0]||ini+dur>e[1])return false;
    return!ag.some(a=>a.prof===prof&&a.data===data&&!['cancelado','faltou'].includes(a.status)&&ini<paraMin(a.hora)+sv(a.serv).min&&paraMin(a.hora)<ini+dur)};
  const novo=o=>{const a=Object.assign({id:'a'+(seq++),extras:{},atraso:0,origem:'balcao',pacote:null,fotos:null,retorno:null,avaliacao:null},o);ag.push(a);return a};
  const formas=['Pix','Pix','Pix','Dinheiro','Débito','Crédito'];
  const dia=k=>{let d=somaDias(hojeD(),k);while(!expediente(d))d=somaDias(d,k<0?-1:1);return ymd(d)};
  novo({cli:'c0',serv:'escova',prof:'carla',data:dia(-42),hora:'10:00',status:'pago',valor:50,forma:'Pix',origem:'app',avaliacao:{nota:'amei'}});
  novo({cli:'c0',serv:'axilas',prof:'wylma',data:dia(-33),hora:'16:00',status:'pago',valor:25,forma:'Pix',origem:'app',retorno:28,avaliacao:{nota:'amei'}});
  novo({cli:'c0',serv:'gloss',prof:'wylma',data:dia(-20),hora:'15:00',status:'pago',valor:120,forma:'Crédito',origem:'app',fotos:{combo:'@labios',divulgar:true},retorno:45,avaliacao:{nota:'amei'}});
  novo({cli:'c0',serv:'clareamento',prof:'wylma',data:dia(-14),hora:'11:00',status:'pago',valor:0,forma:'Pacote',pacote:'k1',origem:'app',avaliacao:{nota:'gostei'}});
  novo({cli:'c0',serv:'clareamento',prof:'wylma',data:dia(-5),hora:'11:00',status:'pago',valor:0,forma:'Pacote',pacote:'k1',origem:'app',retorno:7});
  novo({cli:'c0',serv:'escova',prof:'wylma',data:dia(2),hora:'17:00',status:'agendado',valor:50,origem:'app'});
  novo({cli:'c20',serv:'gloss',prof:'wylma',data:dia(-9),hora:'14:00',status:'pago',valor:120,forma:'Pix',origem:'indicacao'});
  novo({cli:'c18',serv:'progressiva',prof:'wylma',data:dia(-16),hora:'09:00',status:'pago',valor:180,forma:'Pix',origem:'indicacao'});
  novo({cli:'c21',serv:'axilas',prof:'carla',data:dia(3),hora:'10:00',status:'agendado',valor:25,origem:'indicacao'});
  lanc.push({id:'l1',data:clientes[0].pacotes[0].em,tipo:'Pacote',desc:'Clareamento · 5 sessões · Ana Paula',valor:350,forma:'Pix'});
  const indicLog=[{id:'i1',ind:'c0',nova:'c20',data:dia(-9),beneficio:'R$ 20 de crédito',custo:20},{id:'i2',ind:'c4',nova:'c18',data:dia(-16),beneficio:'R$ 20 de crédito',custo:20}];
  const pesos=['escova','escova','hidratacao','buco','axilas','axilas','virilha','perna','gloss','spa','massagem','make','progressiva','clareamento','escova','axilas'];
  const novas=['c18','c20','c21'],sumidas=['c13','c19'];
  for(let k=-34;k<=7;k++){
    const dd=somaDias(hojeD(),k),data=ymd(dd),e=expediente(dd);if(!e)continue;
    const taxa=k<0?0.55:k===0?0.68:0.3-k*0.02;
    for(const p of PROF){
      for(let t=e[0];t<e[1];t+=PASSO){
        if(R()>taxa)continue;
        let s=sorteia(pesos);if(p.id==='carla'&&['gloss','clareamento','massagem'].includes(s))s='escova';
        if(!livre(p.id,data,t,sv(s).min))continue;
        const base=clientes.slice(1).filter(c=>!novas.includes(c.id)&&!sumidas.includes(c.id));
        let c=sorteia(base);for(let n=0;n<12&&ag.some(x=>x.data===data&&x.cli===c.id);n++)c=sorteia(base);
        const a=novo({cli:c.id,serv:s,prof:p.id,data,hora:paraHora(t),status:k<0?(R()<0.04?'faltou':'pago'):'agendado',valor:sv(s).preco,origem:R()<0.6?'app':'balcao'});
        if(a.status==='pago'){a.forma=sorteia(formas);a.avaliacao={nota:R()<0.8?'amei':'gostei'};if(R()<0.12)a.extras.kit=1;if(R()<0.1)a.extras.labial=1}
      }
    }
  }
  sumidas.forEach((id,i)=>novo({cli:id,serv:'progressiva',prof:'wylma',data:dia(-60-i*9),hora:'09:00',status:'pago',valor:180,forma:'Pix'}));
  const hojeAg=ag.filter(a=>a.data===HOJE).sort((x,y)=>paraMin(x.hora)-paraMin(y.hora));
  PROF.forEach(p=>{const l=hojeAg.filter(a=>a.prof===p.id);const feitos=Math.floor(l.length*0.4);
    l.forEach((a,i)=>{if(i<feitos){a.status='pago';a.forma=sorteia(formas)}else if(i===feitos){a.status=p.id==='wylma'?'atendendo':'chegou';if(a.status==='atendendo')a.fotos={antes:null,depois:null}}})});
  const atrasada=hojeAg.find(a=>a.status==='agendado');if(atrasada)atrasada.atraso=10;
  const sens=hojeAg.find(a=>a.status==='agendado'&&a.cli!==(atrasada&&atrasada.cli));if(sens&&!hojeAg.some(x=>x.cli==='c4'))sens.cli='c4';
  const avisos=[];
  if(atrasada)avisos.push({id:'v1',txt:clientes.find(c=>c.id===atrasada.cli).nome+' avisou que vai atrasar 10 min ('+atrasada.hora+')'});
  avisos.push({id:'v2',txt:'Michele agendou pelo convite da Ana Paula: Axilas, '+rotDia(dia(3)).toLowerCase()+' às 10:00. A Ana ganha o benefício quando o atendimento for concluído.'});
  avisos.push({id:'v3',txt:'Mariana pediu o pacote Nutri Gloss · 3 sessões pelo app'});
  return{dia:HOJE,modo:'cliente',aba:{cliente:'inicio',dono:'hoje'},clientes,ag,lanc,avisos,seq,eu:'c0',indicLog,
    serv:SERV,prof:PROF,pacs:PACS,exp:EXP,camp:CAMP,indic:INDIC,bloqueios:[],pedidos:[{id:'q1',cli:'c7',pac:'p-gloss'}],
    fluxo:{cat:null,serv:null,prof:'qualquer',data:null,hora:null,remarca:null},filtroProf:'todos',diaAgenda:HOJE,periodo:'mes',filtroCli:'todas',busca:''};
}
function salvar(){try{localStorage.setItem('wylma-demo2',JSON.stringify(S))}catch(e){}}
function abrir(){try{const x=JSON.parse(localStorage.getItem('wylma-demo2'));if(x&&x.dia===HOJE&&x.ag&&x.camp)return x}catch(e){}return gerar()}
function ligar(){SERV=S.serv;PROF=S.prof;PACS=S.pacs;EXP=S.exp;CAMP=S.camp;INDIC=S.indic}
S=abrir();ligar();

const cl=id=>S.clientes.find(c=>c.id===id);
const ativoAg=a=>!['cancelado','faltou'].includes(a.status);
const bloqueioEm=(prof,data,ini,dur)=>S.bloqueios.find(b=>b.data===data&&(b.prof==='todos'||b.prof===prof)&&ini<b.fim&&b.ini<ini+dur);
function livre(prof,data,ini,dur,ignora){const e=expediente(deYmd(data));if(!e||ini<e[0]||ini+dur>e[1])return false;
  if(bloqueioEm(prof,data,ini,dur))return false;
  return!S.ag.some(a=>a.id!==ignora&&a.prof===prof&&a.data===data&&ativoAg(a)&&ini<paraMin(a.hora)+sv(a.serv).min&&paraMin(a.hora)<ini+dur)}

function retoques(cid){
  const out=[];

    const a=S.ag.filter(x=>x.cli===cid&&x.serv===s.id&&x.status==='pago').sort((x,y)=>x.data.localeCompare(y.data)).pop();if(!a)continue;

    const d=diasDesde(a.data);if(d>=prazo-3)out.push({serv:s,dias:d,prazo,ultimo:a});}
  return out.sort((a,b)=>(b.dias-b.prazo)-(a.dias-a.prazo));

function horasLivres(data,serv,prof,ignora){
  const e=expediente(deYmd(data));if(!e)return[];const dur=sv(serv).min,agora=new Date(),out=[];
  for(let t=e[0];t+dur<=e[1];t+=PASSO){
    if(data===HOJE&&t<agora.getHours()*60+agora.getMinutes()+60)continue;
    const ps=prof==='qualquer'?PROF.map(b=>b.id):[prof];
    const ok=ps.find(b=>livre(b,data,t,dur,ignora));if(ok)out.push({h:paraHora(t),p:ok});
  }return out;
}

/* foto do celular: reduz para no máximo 640 px antes de guardar */
function lerFoto(arquivo,cb){const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const m=640,k=Math.min(1,m/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);cb(cv.toDataURL('image/jpeg',0.8))};img.onerror=()=>aviso('Não deu para abrir essa imagem.');img.src=r.result};r.readAsDataURL(arquivo)}
/* benefício da indicação: só quando a amiga conclui o PRIMEIRO atendimento pago */
function premiarIndicacao(a){const c=cl(a.cli);if(!INDIC.ativo||!c.indicadaPor||S.indicLog.some(x=>x.nova===c.id))return null;
  if(S.ag.some(x=>x.cli===c.id&&x.status==='pago'&&x.id!==a.id))return null;
  const ind=cl(c.indicadaPor),mes=HOJE.slice(0,7);if(!ind)return null;
  if(S.indicLog.filter(x=>x.ind===ind.id&&x.data.slice(0,7)===mes).length>=INDIC.limiteMes)return'Limite de indicações do mês da '+primeiro(ind.nome)+' atingido: sem benefício desta vez.';
  let custo,txt;
  if(INDIC.tipo==='credito'){ind.credito=(ind.credito||0)+INDIC.valor;custo=INDIC.valor;txt=brl0(INDIC.valor)+' de crédito'}
  else{const s=sv(INDIC.serv);ind.pacotes.push({id:novoId('k'),pac:null,nome:s.nome+' · indicação',serv:s.id,sessoes:1,usadas:0,em:HOJE,brinde:true});custo=s.preco;txt='1 sessão de '+s.nome.toLowerCase()}
  S.indicLog.push({id:novoId('i'),ind:ind.id,nova:c.id,data:HOJE,beneficio:txt,custo});
  return primeiro(ind.nome)+' ganhou '+txt+' por indicar a '+primeiro(c.nome)+'.';
}

function carregarImg(src){return new Promise(ok=>{if(!src)return ok(null);const i=new Image();i.onload=()=>ok(i);i.onerror=()=>ok(null);i.src=src})}
function cobrir(g,img,x,y,w,h){const k=Math.max(w/img.width,h/img.height),iw=img.width*k,ih=img.height*k;g.save();g.beginPath();g.rect(x,y,w,h);g.clip();g.drawImage(img,x+(w-iw)/2,y+(h-ih)/2,iw,ih);g.restore()}
function quebrar(g,txt,max){const ps=txt.split(' '),l=[];let at='';for(const p of ps){const t=at?at+' '+p:p;if(g.measureText(t).width>max&&at){l.push(at);at=p}else at=t}if(at)l.push(at);return l}

   case'novoBalcao':{const p=el.dataset.p,h=el.dataset.h;janela('<h3>Marcar '+rotDia(S.diaAgenda).toLowerCase()+' às '+h+'</h3><p class="suave">Com '+esc(pf(p).nome)+'. Para a cliente que ligou ou mandou mensagem.</p>'+
     '<div class="campo"><label for="nbCli">Cliente</label><select id="nbCli">'+S.clientes.slice().sort((x,y)=>x.nome.localeCompare(y.nome)).map(c=>'<option value="'+c.id+'">'+esc(c.nome)+'</option>').join('')+'</select></div>'+
     '<div class="campo"><label for="nbServ">Serviço</label><select id="nbServ">'+CATS.map(cat=>'<optgroup label="'+cat+'">'+servAtivos().filter(s=>s.cat===cat).map(s=>'<option value="'+s.id+'">'+esc(s.nome)+' · '+s.min+' min</option>').join('')+'</optgroup>').join('')+'</select></div>'+

   case'preparaPost':{const s=sv(a.serv);abrirArte('post',{fotos:a.fotos,titulo:s.nome},'Antes e depois: '+s.nome+' 💜\n\n'+(s.cat==='Estética'?'Cuidado de verdade, resultado natural.':s.cat==='Cabelo'?'Fio alinhado, brilho e autoestima lá em cima.':'Pele lisinha e bem cuidada.')+' Feito com carinho aqui na Wylma Espaço Mulher.\n\nAgende o seu pelo app ou chame no WhatsApp.\n\n#wylmaespacomulher #antesedepois #'+s.nome.toLowerCase().normalize('NFD').replace(/[^a-z]/g,'')+' #uberlandia');return}
   case'compartilharArte':{if(!arteAtual)return;const leg=(document.getElementById('legenda')||{}).value||'';

       try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],text:leg});return}}catch(e){if(e&&e.name==='AbortError')return}
       const u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download=arteAtual.nome;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);aviso('Imagem baixada. Copie a legenda e poste no Instagram.')},'image/jpeg',0.9);return}

   /* ajustes */
   case'salvarIndic':{const g=i=>document.getElementById(i);Object.assign(INDIC,{ativo:g('inAtivo').checked,tipo:g('inTipo').value,valor:Math.max(0,parseFloat(g('inValor').value)||0),limiteMes:Math.max(1,parseInt(g('inLim').value)||1),serv:g('inServ').value});aviso('Indicação salva: '+textoBeneficio()+' para quem indica.');break}

   case'tirarBloqueio':S.bloqueios=S.bloqueios.filter(b=>b.id!==id);S.ag.forEach(x=>{if(x.conflito===id)x.conflito=null});aviso('Horário liberado de novo.');break;
   case'expToggle':{const w=+el.dataset.w;EXP[w]=EXP[w]?null:(w===6?[480,960]:[540,1140]);break}
   case'editServ':{const s=id==='novo'?{nome:'',cat:CATS[0],min:60,preco:0,apartir:false,retorno:0,cuidados:'',ativo:true}:sv(id);
     janela('<h3>'+(id==='novo'?'Novo serviço':'Editar serviço')+'</h3><div class="campo"><label for="esNome">Nome</label><input id="esNome" value="'+esc(s.nome)+'" placeholder="Ex.: Design de sobrancelhas"></div>'+

       '<div class="duo"><div class="campo"><label for="esPreco">Preço (R$)</label><input id="esPreco" type="number" step="0.01" min="0" inputmode="decimal" value="'+s.preco+'"></div><div class="campo"><label for="esMin">Duração</label><select id="esMin">'+[30,60,90,120,150,180,240].map(m=>'<option value="'+m+'"'+(m===s.min?' selected':'')+'>'+dur(m)+'</option>').join('')+'</select></div></div>'+
       '<div class="campo"><label for="esRet">Retorno padrão (dias)</label><input id="esRet" type="number" min="0" inputmode="numeric" value="'+(s.retorno||0)+'"><span class="suave" style="font-size:12.5px">Ao finalizar, você ainda ajusta para cada cliente. 0 = sem retorno.</span></div>'+
       '<div class="campo"><label for="esCuid">Cuidados depois do atendimento</label><textarea id="esCuid" placeholder="O que a cliente deve fazer e evitar nos próximos dias">'+esc(s.cuidados||'')+'</textarea></div>'+

       '<button class="btn pri cheio" data-act="salvarServ" data-id="'+id+'">Salvar</button><button class="btn cheio" data-act="fechar">Voltar</button>');return}

       '<button class="btn pri cheio" data-act="salvarPac" data-id="'+id+'">Salvar</button><button class="btn cheio" data-act="fechar">Voltar</button>');return}

     janela('<h3>'+(id==='novo'?'Nova profissional':'Editar profissional')+'</h3><div class="campo"><label for="ebNome">Nome</label><input id="ebNome" value="'+esc(b.nome)+'"></div><div class="campo"><label for="ebCom">Comissão (%)</label><input id="ebCom" type="number" min="0" max="100" inputmode="numeric" value="'+b.com+'"></div>'+
       '<button class="btn pri cheio" data-act="salvarProf" data-id="'+id+'">Salvar</button><button class="btn cheio" data-act="fechar">Voltar</button>');return}
   case'salvarProf':{const nome=document.getElementById('ebNome').value.trim(),com=Math.min(100,Math.max(0,parseInt(document.getElementById('ebCom').value)||0));if(!nome){aviso('Coloque o nome.');return}
     if(id==='novo')PROF.push({id:novoId('b'),nome,com,cor:CORES_PROF[PROF.length%CORES_PROF.length]});else Object.assign(pf(id),{nome,com});fechar();aviso('Profissional salva.');break}
   default:return;
  }
  desenhar();

/* guarda o que já foi digitado na janela de finalizar antes de redesenhá-la */
function lerFin(){if(!fin)return;const v=document.getElementById('fValor'),r=document.getElementById('fRet'),d=document.getElementById('fDiv');
  if(v)fin.valor=Math.max(0,parseFloat(v.value)||0);if(r)fin.retorno=Math.max(0,parseInt(r.value)||0);if(d)fin.divulgar=d.checked}
document.addEventListener('change',ev=>{const t=ev.target;
  if(t.dataset.foto&&t.files&&t.files[0]){const q=t.dataset.foto;lerFoto(t.files[0],url=>{if(q==='camp'){lerCamp();campEd.img=url;janelaCamp()}else if(fin){lerFin();fin[q]=url;janelaFinalizar()}else if(ini){ini[q]=url;janelaComecar()}});return}
  if(t.dataset.exp){const w=+t.dataset.w,p=+t.dataset.p;EXP[w][p]=+t.value;if(EXP[w][0]>=EXP[w][1]){if(p)EXP[w][0]=EXP[w][1]-PASSO;else EXP[w][1]=EXP[w][0]+PASSO;aviso('Ajustei: o fechamento precisa ser depois da abertura.')}desenhar();return}
  if(t.id==='cpBrTipo'||t.id==='cpServ'){mostrarBrinde();return}
  if(['bqData','bqProf','bqH1','bqH2'].includes(t.id)){lerBloq();janelaBloq()}
});
document.addEventListener('input',ev=>{
  if(ev.target.id==='busca'){S.busca=ev.target.value;const p=ev.target.selectionStart;desenhar();const b=document.getElementById('busca');b.focus();b.setSelectionRange(p,p)}
  if(ev.target.id==='fValor'&&fin){lerFin();const c=cl(S.ag.find(x=>x.id===fin.id).cli),base=fin.usaPac?0:fin.valor,t0=base+EXTRAS.reduce((s,x)=>s+(fin.extras[x.id]||0)*x.preco,0),t=t0-(fin.usaCred?Math.min(c.credito,t0):0);
    const tb=camada.querySelector('.total b');if(tb)tb.textContent=brl(t);const ok=camada.querySelector('[data-act="fOk"]');if(ok){ok.textContent=t>0?(fin.forma?'Recebi '+brl(t):'Escolha a forma de pagamento'):'Concluir';ok.disabled=t>0&&!fin.forma}}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')fechar()});
document.getElementById('recomecar').addEventListener('click',()=>{try{localStorage.removeItem('wylma-demo2')}catch(e){}S=gerar();ligar();fechar();desenhar();window.scrollTo(0,0);aviso('Demonstração recomeçada.')});
desenhar();
})();
