<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500;1,600;1,700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<style>
/* Layout: app de celular numa coluna (até 520px), claro e delicado como a marca da Wylma: lilás, ameixa e rosa-blush; títulos em itálico serifado, nome em letra cursiva, barra de abas fixa embaixo. */
:root{
  --bg:#fbf6fa; --sup:#ffffff; --sup2:#f6edf5; --linha:#ecdcea; --tinta:#2f1a36; --suave:#836f88;
  --ameixa:#6b2f7a; --ameixa-esc:#4d1f59; --lilas:#a46bb5; --rosa:#e7a9c8; --blush:#fcecf4;
  --ok:#2f8a5b; --ok-bg:#e3f4ea; --aviso:#9a6400; --aviso-bg:#fdf0d6; --alerta:#bd3a53; --alerta-bg:#fce6ea;
  --cursiva:"Great Vibes","Brush Script MT",cursive;
  --titulo:"Cormorant Garamond","Georgia",serif;
  --corpo:"Nunito Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--tinta);font:15px/1.5 var(--corpo);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--lilas);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);border-inline:1px solid var(--linha)}
@media (max-width:540px){.app{border-inline:0}}

/* Cabeçalho */
.topo{padding:14px 16px 16px;background:radial-gradient(120% 120% at 100% 0%,#f3d9ea 0%,#f7ecf5 45%,var(--bg) 100%);position:relative;overflow:hidden}
.topo::after{content:"";position:absolute;right:-60px;top:-70px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(164,107,181,.22),transparent 70%);pointer-events:none}
.demo{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;position:relative;z-index:1}
.demo small{font:700 10.5px/1 var(--corpo);letter-spacing:.16em;text-transform:uppercase;color:var(--suave)}
.troca{display:flex;background:rgba(255,255,255,.7);border:1px solid var(--linha);border-radius:99px;padding:3px}
.troca button{border:0;background:none;padding:6px 12px;border-radius:99px;font:700 13px/1 var(--corpo);color:var(--suave)}
.troca button[aria-pressed="true"]{background:var(--ameixa);color:#fff}
.marca{display:flex;flex-direction:column;align-items:flex-start;position:relative;z-index:1}
.marca .w{font:400 52px/0.95 var(--cursiva);color:var(--ameixa)}
.marca .e{font:700 11.5px/1 var(--corpo);letter-spacing:.42em;text-transform:uppercase;color:var(--lilas);margin:2px 0 0 6px}

main{flex:1;padding:18px 16px 24px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font:italic 700 30px/1.05 var(--titulo);color:var(--ameixa-esc)}
h2{font:800 11.5px/1 var(--corpo);letter-spacing:.14em;text-transform:uppercase;color:var(--suave)}
p{margin:0}
.suave{color:var(--suave)}
.bloco{display:flex;flex-direction:column;gap:10px}
.cartao{background:var(--sup);border:1px solid var(--linha);border-radius:18px;padding:15px;box-shadow:0 1px 2px rgba(107,47,122,.04),0 8px 24px rgba(107,47,122,.05)}
.linha{display:flex;align-items:center;gap:10px;justify-content:space-between}
.num{font-variant-numeric:tabular-nums}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--linha);background:var(--sup);border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px;line-height:1;color:var(--tinta)}
.btn.pri{background:var(--ameixa);border-color:var(--ameixa);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.cheio{width:100%;padding:14px}
.btn.peq{padding:7px 11px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.acoes{display:flex;flex-wrap:wrap;gap:8px}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--linha);background:var(--sup);border-radius:99px;padding:8px 13px;font-weight:700;font-size:13.5px;line-height:1;white-space:nowrap;color:var(--tinta)}
.chip[aria-pressed="true"]{background:var(--ameixa);color:#fff;border-color:var(--ameixa)}
@media (hover:hover) and (pointer:fine){.chips{flex-wrap:wrap;overflow:visible}}

.st{display:inline-flex;align-items:center;gap:5px;font:800 11px/1 var(--corpo);letter-spacing:.05em;text-transform:uppercase;padding:5px 8px;border-radius:99px;white-space:nowrap}
.st.agendado{border:1px solid var(--linha);color:var(--suave)}
.st.chegou{background:var(--aviso-bg);color:var(--aviso)}
.st.atendendo{background:var(--ameixa);color:#fff}
.st.pago{background:var(--ok-bg);color:var(--ok)}
.st.faltou,.st.cancelado{color:var(--suave);text-decoration:line-through}
.st.pac{background:var(--blush);color:var(--ameixa)}
.st.atraso{background:var(--aviso-bg);color:var(--aviso)}
.st.alerta{background:var(--alerta-bg);color:var(--alerta);text-transform:none;letter-spacing:0;font-size:12px}

/* Cliente */
.ola{font:400 40px/1 var(--cursiva);color:var(--ameixa)}
.prox{background:linear-gradient(150deg,var(--ameixa),#8d4a9c 60%,#b0679f);color:#fff;border-radius:20px;padding:17px;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 30px rgba(107,47,122,.25)}
.prox h2{color:rgba(255,255,255,.75)}
.prox .quando{font:italic 700 38px/1 var(--titulo)}
.prox .quando span{font:700 15px/1 var(--corpo);opacity:.8;margin-left:8px;font-style:normal}
.prox .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff}
.promo{border-radius:20px;overflow:hidden;background:var(--sup);border:1px solid var(--linha);box-shadow:0 8px 24px rgba(107,47,122,.08)}
.promo img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;max-width:100%}
.promo .txt{padding:14px;display:flex;flex-direction:column;gap:10px}
.promo .tag{align-self:flex-start;font:800 10.5px/1 var(--corpo);letter-spacing:.14em;text-transform:uppercase;color:var(--ameixa);background:var(--blush);padding:6px 9px;border-radius:99px}
.aviso-cli{display:flex;gap:12px;align-items:center;background:var(--blush);border:1px solid #f3cfe2;border-radius:16px;padding:13px 14px}
.aviso-cli .ic{flex:none;width:38px;height:38px;border-radius:12px;background:#fff;display:grid;place-items:center;color:var(--ameixa)}
.aviso-cli .ic svg{width:20px;height:20px}
.aviso-cli p{flex:1;min-width:0;font-size:14px;line-height:1.35}
.bolinhas{display:flex;gap:6px;flex-wrap:wrap}
.bolinhas i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--rosa);display:block}
.bolinhas i.ok{background:linear-gradient(135deg,var(--lilas),var(--ameixa));border-color:var(--ameixa)}

.lista{display:flex;flex-direction:column;gap:8px}
.op{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;width:100%;background:var(--sup);border:1px solid var(--linha);border-radius:14px;padding:12px 14px}
.op[aria-pressed="true"]{border-color:var(--ameixa);box-shadow:inset 0 0 0 1px var(--ameixa);background:#fdf8fc}
.op b{display:block;font-size:15px}
.op small{color:var(--suave);font-size:13px}
.op .preco{font:800 15px/1 var(--corpo);white-space:nowrap;color:var(--ameixa-esc)}
.op .preco small{display:block;font-size:11px;font-weight:600;text-align:right}
.horas{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hora{border:1px solid var(--linha);background:var(--sup);border-radius:12px;padding:11px 0;font:800 15px/1 var(--corpo);font-variant-numeric:tabular-nums}
.hora[aria-pressed="true"]{background:var(--ameixa);border-color:var(--ameixa);color:#fff}
.dia{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:58px;padding:9px 10px;border-radius:14px}
.dia small{font:800 10.5px/1 var(--corpo);letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.dia b{font:italic 700 22px/1 var(--titulo)}
.resumo{position:sticky;bottom:72px;background:#fff;border:1px solid var(--linha);border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center;justify-content:space-between;box-shadow:0 -10px 30px rgba(107,47,122,.12)}
.resumo p{font-size:13.5px;line-height:1.35;min-width:0}
.brinde{color:var(--ok);font-weight:800}

/* Equipe */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--sup);border:1px solid var(--linha);border-radius:14px;padding:12px 10px}
.kpi small{display:block;font:800 10.5px/1.2 var(--corpo);letter-spacing:.1em;text-transform:uppercase;color:var(--suave)}
.kpi b{display:block;font:italic 700 24px/1.1 var(--titulo);color:var(--ameixa-esc);font-variant-numeric:tabular-nums;margin-top:6px}
.kpi{min-width:0}
.at .q .linha{flex-wrap:wrap;row-gap:4px}
@media (max-width:330px){.demo small{font-size:9px;letter-spacing:.08em}.troca button{padding:6px 9px;font-size:12px}main{padding-inline:12px}}
@media (max-width:380px){.kpi{padding:10px 8px}.kpi b{font-size:19px}.kpi small{font-size:9.5px;letter-spacing:.06em}}
.aviso{display:flex;gap:10px;align-items:flex-start;background:var(--sup);border:1px solid var(--linha);border-left:3px solid var(--lilas);border-radius:12px;padding:11px 12px;font-size:14px}
.aviso .x{margin-left:auto;background:none;border:0;color:var(--ameixa);font-weight:800;font-size:13px;white-space:nowrap}
.fila{display:flex;flex-direction:column;gap:8px}
.at{display:grid;grid-template-columns:56px 1fr;gap:12px;background:var(--sup);border:1px solid var(--linha);border-radius:14px;padding:12px}
.at.feito{opacity:.6}
.at .h{font:italic 700 20px/1 var(--titulo);color:var(--ameixa-esc);font-variant-numeric:tabular-nums;padding-top:2px}
.at .h small{display:block;font:700 12px/1 var(--corpo);color:var(--suave);margin-top:5px;font-style:normal}
.at .q{display:flex;flex-direction:column;gap:6px;min-width:0}
.at .q b{font-size:15.5px}
.at .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--suave)}
.prof{display:inline-flex;align-items:center;gap:6px}
.prof i{width:8px;height:8px;border-radius:50%}
.grade{display:grid;gap:4px;align-items:stretch}
.grade .hh{font:700 12px/1 var(--corpo);color:var(--suave);padding-top:6px;font-variant-numeric:tabular-nums}
.grade .cab{font:800 12px/1 var(--corpo);letter-spacing:.08em;text-transform:uppercase;text-align:center;padding:6px 0}
.livre{border:1px dashed var(--linha);border-radius:10px;background:none;color:var(--suave);font-size:12px;min-height:40px}
.livre:hover{border-color:var(--lilas);color:var(--ameixa)}
.bloc{border-radius:10px;padding:6px 8px;background:var(--blush);border:0;border-left:3px solid var(--lilas);font-size:12.5px;line-height:1.25;overflow:hidden;min-height:40px;text-align:left}
.bloc b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bloc.pago{border-left-color:var(--ok);background:#f2faf5}.bloc.atendendo{border-left-color:var(--ameixa)}.bloc.chegou{border-left-color:var(--aviso)}
.bloqueado{border-radius:10px;min-height:40px;display:grid;place-items:center;font-size:11.5px;color:var(--suave);background:repeating-linear-gradient(-45deg,var(--sup) 0 6px,var(--sup2) 6px 12px)}
.barras{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:6px}
.barras i{flex:1;background:linear-gradient(180deg,var(--lilas),var(--ameixa));border-radius:4px 4px 0 0;min-height:2px;opacity:.85}
.barras i.hoje{background:var(--rosa)}
.tab{width:100%;border-collapse:collapse;font-size:14px}
.tab td{padding:9px 0;border-bottom:1px solid var(--linha);vertical-align:top}
.tab td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.tab tr:last-child td{border-bottom:0}
.busca{width:100%;background:var(--sup);border:1px solid var(--linha);border-radius:14px;padding:12px 14px;color:var(--tinta);font:inherit}
.cli{display:flex;align-items:center;gap:12px;background:var(--sup);border:1px solid var(--linha);border-radius:14px;padding:11px 12px}
.av{flex:none;width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--blush),#f1d3e6);display:grid;place-items:center;font:italic 700 17px/1 var(--titulo);color:var(--ameixa)}
.cli .q{flex:1;min-width:0}
@media (max-width:400px){.cli{flex-wrap:wrap}.cli>.acoes{width:100%;justify-content:flex-end;padding-left:52px}.cli>.acoes .btn{flex:1}}
.cli .q b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cli .q small{color:var(--suave);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.hsel{background:var(--sup);border:1px solid var(--linha);border-radius:8px;padding:6px 4px;color:var(--tinta);font:700 14px/1 var(--corpo);font-variant-numeric:tabular-nums}
.marcar{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.35}
.marcar input{width:20px;height:20px;accent-color:var(--ameixa);flex:none;margin:0}
.fotos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fotos figure{margin:0;display:flex;flex-direction:column;gap:4px}
.fotos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;max-width:100%;border:1px solid var(--linha)}
.fotos figcaption{font:800 10.5px/1 var(--corpo);letter-spacing:.12em;text-transform:uppercase;color:var(--suave);text-align:center}
.foto-unica{width:100%;border-radius:14px;max-width:100%;border:1px solid var(--linha)}
.sobe{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;aspect-ratio:1;border:1.5px dashed var(--rosa);border-radius:12px;background:var(--blush);color:var(--ameixa);font-weight:800;font-size:13px;cursor:pointer;text-align:center;padding:8px}
.sobe input{position:absolute;width:1px;height:1px;opacity:0}

.abas{position:sticky;bottom:0;display:grid;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-top:1px solid var(--linha);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.abas button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;font:700 11px/1 var(--corpo);color:var(--suave);border-radius:12px}
.abas button svg{width:22px;height:22px}
.abas button{min-width:0;overflow:hidden}
.abas button span{display:block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:380px){.abas{padding-inline:2px}.abas button{font-size:9.5px;gap:3px;padding:6px 0}.abas button svg{width:20px;height:20px}}
.abas button[aria-current="page"]{color:var(--ameixa)}
.abas button[aria-current="page"] svg{color:var(--ameixa)}

.fundo-modal{position:fixed;inset:0;background:rgba(47,26,54,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal{width:100%;max-width:520px;max-height:90vh;overflow:auto;background:var(--sup);border-radius:22px 22px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.modal h3{font:italic 700 26px/1.1 var(--titulo);color:var(--ameixa-esc)}
.zap{background:#efeae2;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.zap .bal{align-self:flex-end;background:#d9fdd3;color:#111b21;border-radius:10px 10px 2px 10px;padding:9px 11px;font-size:14px;max-width:92%;white-space:pre-wrap}
.campo{display:flex;flex-direction:column;gap:6px}
.campo label{font:800 11px/1 var(--corpo);letter-spacing:.1em;text-transform:uppercase;color:var(--suave)}
.campo select,.campo input,.campo textarea{background:var(--sup);border:1px solid var(--linha);border-radius:12px;padding:11px 12px;color:var(--tinta);font:inherit}
.campo textarea{min-height:70px;resize:vertical}
.qtd{display:flex;align-items:center;gap:10px}
.qtd button{width:32px;height:32px;border-radius:10px;border:1px solid var(--linha);background:var(--sup);font-weight:800}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--linha);padding-top:12px}
.total b{font:italic 700 32px/1 var(--titulo);color:var(--ameixa-esc);font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ameixa-esc);color:#fff;font-weight:700;font-size:14px;padding:11px 16px;border-radius:14px;z-index:30;box-shadow:0 10px 30px rgba(47,26,54,.3);max-width:calc(100% - 32px);text-align:center}
.rodape{font-size:12px;color:var(--suave);text-align:center;padding:4px 16px 14px}
.rodape button{background:none;border:0;color:var(--suave);text-decoration:underline;font-size:12px}
.kpi b,.at .h,.prox .quando,.total b,.dia b{font-variant-numeric:lining-nums tabular-nums}
.vazio{text-align:center;color:var(--suave);padding:20px 10px;border:1px dashed var(--linha);border-radius:14px}
@media (prefers-reduced-motion:no-preference){.st.atendendo{animation:pulsa 1.6s ease-in-out infinite}}
@keyframes pulsa{50%{opacity:.65}}
</style>
</head>
<body>


<div class="app">
  <header class="topo">
    <div class="demo">
      <small>Demonstração</small>
      <div class="troca" role="group" aria-label="Ver como">
        <button type="button" id="modoCliente" data-modo="cliente">Cliente</button>
        <button type="button" id="modoDono" data-modo="dono">Espaço</button>
      </div>
    </div>
    <div class="marca"><span class="w">Wylma</span><span class="e">Espaço Mulher</span></div>
  </header>
  <main id="tela"></main>
  <p class="rodape">Dados de exemplo · sistema <b>Torque</b> · <button type="button" id="recomecar">Recomeçar demonstração</button></p>
  <nav class="abas" id="abas" aria-label="Seções"></nav>
</div>
<div id="camada"></div>

<script>
(function(){
'use strict';
const IMG_PROMO='promo.jpg', IMG_LABIOS='labios.jpg';
/* ---------- utilidades ---------- */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const deYmd=s=>{const[a,m,d]=s.split('-').map(Number);return new Date(a,m-1,d)};
const somaDias=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const paraMin=h=>{const[a,b]=h.split(':').map(Number);return a*60+b};
const paraHora=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const brl=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const brl0=v=>brl(v).replace(/,00$/,'');

  for(let k=-34;k<=7;k++){
    const dd=somaDias(hojeD(),k),data=ymd(dd),e=expediente(dd);if(!e)continue;

      for(let t=e[0];t<e[1];t+=PASSO){

  const fut=ag.find(a=>a.data!==HOJE&&a.status==='agendado'&&a.origem==='app'&&a.cli!=='c0');

  avisos.push({id:'v3',txt:'Mariana pediu o pacote Nutri Gloss · 3 sessões pelo app'});

}

/* retoques: serviço com prazo de retorno cuja última vez já passou (ou está a 3 dias) do prazo */
function retoques(cid){
  const out=[];
  for(const s of SERV){if(!s.retorno||s.ativo===false)continue;
    const l=S.ag.filter(a=>a.cli===cid&&a.serv===s.id&&a.status==='pago').map(a=>a.data).sort().pop();if(!l)continue;
    if(S.ag.some(a=>a.cli===cid&&a.serv===s.id&&a.status==='agendado'&&a.data>=HOJE))continue;
    const d=diasDesde(l);if(d>=s.retorno-3)out.push({serv:s,dias:d,ultimo:l});}
  return out.sort((a,b)=>(b.dias-b.serv.retorno)-(a.dias-a.serv.retorno));
}

/* foto do celular: reduz para no máximo 640 px antes de guardar */
function lerFoto(arquivo,cb){const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const m=640,esc2=Math.min(1,m/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=Math.round(img.width*esc2);cv.height=Math.round(img.height*esc2);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);cb(cv.toDataURL('image/jpeg',0.8))};img.onerror=()=>aviso('Não deu para abrir essa imagem.');img.src=r.result};r.readAsDataURL(arquivo)}

document.addEventListener('click',ev=>{
  const m=ev.target.closest('[data-modo]');if(m){S.modo=m.dataset.modo;fechar();desenhar();window.scrollTo(0,0);return}
  const ab=ev.target.closest('[data-aba]');if(ab){S.aba[S.modo]=ab.dataset.aba;fechar();desenhar();window.scrollTo(0,0);return}
  const el=ev.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act,id=el.dataset.id,F=S.fluxo;
  if(act==='fechar'){if(el.classList.contains('fundo-modal')&&ev.target!==el)return;fechar();return}
  const a=id?S.ag.find(x=>x.id===id):null,novoF=o=>Object.assign({cat:null,serv:null,prof:'qualquer',data:null,hora:null,remarca:null},o);
  switch(act){
   case'escolherCat':S.fluxo=novoF({cat:id});S.aba.cliente='agendar';window.scrollTo(0,0);break;
   case'escolherServ':S.fluxo=novoF({serv:id,cat:sv(id).cat});S.aba.cliente='agendar';window.scrollTo(0,0);break;
   case'fCat':F.cat=id;F.serv=null;F.hora=null;F.data=null;break;
   case'fServ':F.serv=id;F.hora=null;F.data=null;break;
   case'fProf':F.prof=id;F.hora=null;break;
   case'fDia':F.data=id;F.hora=null;break;
   case'fHora':F.hora=id;F.profEsc=el.dataset.p;break;
   case'confirmar':{
     const s=sv(F.serv),eu=cl(S.eu),k=pacoteDoServ(eu,s.id);let msg;
     if(F.remarca){const x=S.ag.find(y=>y.id===F.remarca),antes=rotDia(x.data).toLowerCase()+' '+x.hora;Object.assign(x,{serv:F.serv,prof:F.profEsc,data:F.data,hora:F.hora,atraso:0,conflito:null});
       S.avisos.unshift({id:'v'+Date.now(),txt:eu.nome+' remarcou pelo app: de '+antes+' para '+rotDia(F.data).toLowerCase()+' às '+F.hora});msg='Remarcado para '+rotDia(F.data).toLowerCase()+' às '+F.hora+'.';}
     else{S.ag.push({id:'a'+(S.seq++),cli:S.eu,serv:F.serv,prof:F.profEsc,data:F.data,hora:F.hora,status:'agendado',valor:k?0:s.preco,pacote:k?k.id:null,extras:{},atraso:0,origem:'app',fotos:null});
       S.avisos.unshift({id:'v'+Date.now(),txt:eu.nome+' agendou pelo app: '+s.nome+', '+rotDia(F.data).toLowerCase()+' às '+F.hora+' com '+pf(F.profEsc).nome});
       msg='Agendado: '+rotDia(F.data).toLowerCase()+' às '+F.hora+'. O espaço já foi avisado.';
       if(PROMO.ativa&&s.cat==='Depilação'&&!eu.pacotes.some(x=>x.brinde&&x.usadas<x.sessoes)){eu.pacotes.push({id:'k'+Date.now(),pac:null,nome:'Clareamento · brinde '+PROMO.titulo,serv:'clareamento',sessoes:1,usadas:0,em:HOJE,brinde:true});msg='Agendado! E você ganhou 1 sessão de clareamento. Ela já está em Pacotes.'}}
     S.fluxo=novoF({});S.aba.cliente='inicio';desenhar();window.scrollTo(0,0);aviso(msg);return}
   case'remarcar':S.fluxo=novoF({serv:a.serv,cat:sv(a.serv).cat,prof:a.prof,data:a.data,remarca:a.id});S.aba.cliente='agendar';break;
   case'cancelar':janela('<h3>Cancelar o horário?</h3><p>'+esc(sv(a.serv).nome)+', '+rotDia(a.data).toLowerCase()+' às '+a.hora+'.</p><div class="campo"><label>Motivo</label><div class="chips" style="flex-wrap:wrap">'+['Imprevisto','Trabalho','Vou remarcar depois'].map(t=>'<button class="chip" data-act="cancelarOk" data-id="'+a.id+'" data-m="'+t+'">'+t+'</button>').join('')+'</div></div><button class="btn cheio" data-act="fechar">Manter horário</button>');return;
   case'cancelarOk':a.status='cancelado';S.avisos.unshift({id:'v'+Date.now(),txt:cl(a.cli).nome+' cancelou '+rotDia(a.data).toLowerCase()+' às '+a.hora+' ('+el.dataset.m.toLowerCase()+'). O horário ficou livre.'});fechar();aviso('Horário cancelado. A vaga foi liberada.');break;
   case'atrasar':janela('<h3>Quanto vai atrasar?</h3><div class="acoes">'+[10,15,20].map(n=>'<button class="btn" data-act="atrasoOk" data-id="'+a.id+'" data-n="'+n+'">'+n+' min</button>').join('')+'</div><button class="btn cheio" data-act="fechar">Voltar</button>');return;
   case'atrasoOk':a.atraso=+el.dataset.n;S.avisos.unshift({id:'v'+Date.now(),txt:cl(a.cli).nome+' avisou que vai atrasar '+a.atraso+' min ('+rotDia(a.data).toLowerCase()+', '+a.hora+')'});fechar();aviso('Avisamos a '+pf(a.prof).nome+'.');break;
   case'ficha':janelaFicha(S.eu,true);return;
   case'salvarFicha':{if(!document.getElementById('fsOk').checked){aviso('Marque a autorização para salvar.');return}
     const g=i=>document.getElementById(i);cl(S.eu).saude={alergia:g('fsAlergia').value.trim(),gestante:g('fsGest').checked,sensivel:g('fsSens').checked,diabetes:g('fsDiab').checked,acidos:g('fsAcid').checked,obs:g('fsObs').value.trim(),em:HOJE};
     fechar();aviso('Ficha salva. Obrigada por cuidar da sua segurança!');break}
   case'verFotos':janelaFotos(a);return;
   case'pedirPacote':{const p=pc(id);if(!S.pedidos.some(q=>q.cli===S.eu&&q.pac===id))S.pedidos.push({id:'q'+Date.now(),cli:S.eu,pac:id});S.avisos.unshift({id:'v'+Date.now(),txt:cl(S.eu).nome+' pediu o pacote '+p.nome+' pelo app'});aviso('Pedido enviado! A Wylma confirma com você o pagamento.');break}
   case'okAviso':S.avisos=S.avisos.filter(v=>v.id!==id);break;

   case'status':a.status=el.dataset.st;if(a.status==='atendendo')a.atraso=0;break;
   case'finalizar':{const c=cl(a.cli),k=a.pacote?c.pacotes.find(x=>x.id===a.pacote):pacoteDoServ(c,a.serv);fin={id:a.id,valor:a.pacote?sv(a.serv).preco:a.valor,usaPac:!!(a.pacote||k),extras:Object.assign({},a.extras),forma:null,antes:null,depois:null};janelaFinalizar();return}

     const base=k?0:fin.valor,ext=EXTRAS.reduce((t,e)=>t+(fin.extras[e.id]||0)*e.preco,0);
     if(k){k.usadas=Math.min(k.sessoes,k.usadas+1);x.pacote=k.id}else x.pacote=null;
     Object.assign(x,{status:'pago',valor:base,extras:fin.extras,forma:base+ext>0?fin.forma:'Pacote',fotos:fin.antes||fin.depois?{antes:fin.antes,depois:fin.depois}:x.fotos});
     fechar();aviso(base+ext>0?'Recebido '+brl(base+ext)+'.'+(x.fotos&&!x.fotos.combo?' Fotos salvas no histórico da '+primeiro(c.nome)+'.':''):'Sessão do pacote registrada ('+k.usadas+' de '+k.sessoes+').');break}

   case'verAg':{const c=cl(a.cli);janela('<h3>'+esc(c.nome)+'</h3><p>'+esc(sv(a.serv).nome)+' · '+rotDia(a.data)+' às '+a.hora+' com '+esc(pf(a.prof).nome)+'</p><div class="acoes">'+st(a.status)+(a.pacote?'<span class="st pac">Pacote</span>':'')+alertasSaude(c).map(x=>'<span class="st alerta">'+esc(x)+'</span>').join('')+'</div>'+
     (a.status==='agendado'?'<button class="btn cheio" data-act="zapLembrete" data-id="'+a.id+'">Mandar lembrete no WhatsApp</button><button class="btn cheio" data-act="desmarcar" data-id="'+a.id+'">Desmarcar (avisa a cliente)</button>':'')+'<button class="btn cheio" data-act="fechar">Fechar</button>');return}

   case'desmarcar':{const c=cl(a.cli);a.status='cancelado';desenhar();zap(c,'Oi, '+primeiro(c.nome)+'! Tive um imprevisto e precisei desmarcar seu horário de '+rotDia(a.data).toLowerCase()+' às '+a.hora+'. Me desculpe! Já escolhe outro horário pelo app, tem vaga essa semana 💜');return}
   case'novoBalcao':{const p=el.dataset.p,h=el.dataset.h;janela('<h3>Marcar '+rotDia(S.diaAgenda).toLowerCase()+' às '+h+'</h3><p class="suave">Com '+esc(pf(p).nome)+'. Para a cliente que ligou ou mandou mensagem.</p>'+
     '<div class="campo"><label for="nbCli">Cliente</label><select id="nbCli">'+S.clientes.slice().sort((x,y)=>x.nome.localeCompare(y.nome)).map(c=>'<option value="'+c.id+'">'+esc(c.nome)+'</option>').join('')+'</select></div>'+

   case'novoBalcaoOk':{const cid=document.getElementById('nbCli').value,s=sv(document.getElementById('nbServ').value),p=el.dataset.p,h=el.dataset.h,c=cl(cid);

     const k=pacoteDoServ(c,s.id);S.ag.push({id:'a'+(S.seq++),cli:cid,serv:s.id,prof:p,data:S.diaAgenda,hora:h,status:'agendado',valor:k?0:s.preco,pacote:k?k.id:null,extras:{},atraso:0,origem:'balcao',fotos:null});
     desenhar();zap(c,'Oi, '+primeiro(c.nome)+'! Tá marcado: '+s.nome+' '+rotDia(S.diaAgenda).toLowerCase()+' às '+h+' com a '+pf(p).nome+' 💜 Qualquer coisa, remarca pelo app.');return}
   case'filtroCli':S.filtroCli=id;break;
   case'verCliente':janelaFicha(id,false);return;
   case'zapCliente':{const c=cl(id),rt=retoques(id),u=ultimo(id);let t;
     if(S.filtroCli==='aniv'||(anivMes(c)&&S.filtroCli!=='retocar'))t='Feliz aniversário, '+primeiro(c.nome)+'! 🎉 Para comemorar, seu próximo atendimento aqui no Wylma Espaço Mulher tem 10% de desconto neste mês. Escolha seu horário no app 💜';
     else if(rt.length)t='Oi, '+primeiro(c.nome)+'! Já faz '+rt[0].dias+' dias '+deRetoque(rt[0].serv)+' aqui no Wylma Espaço Mulher 💜 Que tal agendar o retoque? É só escolher o horário no app.';
     else if(u&&diasDesde(u)>45)t='Oi, '+primeiro(c.nome)+'! Estamos com saudade de você por aqui 💜 Bora tirar um tempinho pra você? Tem horário essa semana, é só escolher no app.';
     else t='Oi, '+primeiro(c.nome)+'! Tudo bem? 💜';
     zap(c,t);return}
   case'venderPacote':{const pre={cli:el.dataset.cli||'',pac:el.dataset.pac||PACS[0].id,q:el.dataset.q||''};
     janela('<h3>Vender pacote</h3><div class="campo"><label for="vpCli">Cliente</label><select id="vpCli">'+S.clientes.slice().sort((x,y)=>x.nome.localeCompare(y.nome)).map(c=>'<option value="'+c.id+'"'+(c.id===pre.cli?' selected':'')+'>'+esc(c.nome)+'</option>').join('')+'</select></div>'+
       '<div class="campo"><label for="vpPac">Pacote</label><select id="vpPac">'+PACS.map(p=>'<option value="'+p.id+'"'+(p.id===pre.pac?' selected':'')+'>'+esc(p.nome)+' · '+brl(p.preco)+'</option>').join('')+'</select></div>'+
       '<div class="campo"><label for="vpForma">Forma de pagamento</label><select id="vpForma">'+['Pix','Dinheiro','Débito','Crédito'].map(f=>'<option>'+f+'</option>').join('')+'</select></div>'+
       '<button class="btn pri cheio" data-act="venderPacoteOk" data-q="'+pre.q+'">Registrar venda</button><button class="btn cheio" data-act="fechar">Voltar</button>');return}
   case'venderPacoteOk':{const c=cl(document.getElementById('vpCli').value),p=pc(document.getElementById('vpPac').value),f=document.getElementById('vpForma').value;
     c.pacotes.push({id:'k'+Date.now(),pac:p.id,nome:p.nome,serv:p.serv,sessoes:p.sessoes,usadas:0,em:HOJE});
     S.lanc.push({id:'l'+Date.now(),data:HOJE,tipo:'Pacote',desc:p.nome+' · '+c.nome,valor:p.preco,forma:f});
     if(el.dataset.q)S.pedidos=S.pedidos.filter(q=>q.id!==el.dataset.q);else S.pedidos=S.pedidos.filter(q=>!(q.cli===c.id&&q.pac===p.id));
     fechar();aviso('Pacote vendido para '+primeiro(c.nome)+': '+brl(p.preco)+' no caixa.');break}
   case'periodo':S.periodo=id;break;
   case'salvarPromo':PROMO.titulo=document.getElementById('prTit').value.trim()||PROMO.titulo;PROMO.texto=document.getElementById('prTxt').value.trim()||PROMO.texto;PROMO.ativa=document.getElementById('prAtiva').checked;aviso(PROMO.ativa?'Promoção no ar no app das clientes.':'Promoção escondida.');break;
   case'novoBloqueio':blq={data:HOJE,prof:'todos',tipo:'apos',h1:null,h2:null,motivo:'Imprevisto'};janelaBloq();return;

   case'bqMotivo':lerBloq();blq.motivo=id;janelaBloq();return;
   case'bqOk':{lerBloq();const e=expediente(deYmd(blq.data));let ini,fim;
     if(blq.tipo==='dia'){ini=e[0];fim=e[1]}else if(blq.tipo==='apos'){ini=e[0];fim=blq.h1}else if(blq.tipo==='ate'){ini=blq.h1;fim=e[1]}else{ini=blq.h1;fim=blq.h2}
     if(!(ini<fim)){aviso('O fim precisa ser depois do começo.');return}
     const b={id:'b'+Date.now(),data:blq.data,prof:blq.prof,ini,fim,tipo:blq.tipo,diaTodo:blq.tipo==='dia',motivo:blq.motivo};S.bloqueios.push(b);
     const afet=S.ag.filter(x=>x.data===b.data&&x.status==='agendado'&&(b.prof==='todos'||x.prof===b.prof)&&paraMin(x.hora)<fim&&ini<paraMin(x.hora)+sv(x.serv).min);
     afet.forEach(x=>x.conflito=b.id);fechar();desenhar();
     if(afet.length)janela('<h3>Bloqueado. '+afet.length+(afet.length===1?' cliente estava marcada':' clientes estavam marcadas')+'</h3><p class="suave" style="font-size:13.5px">Avise cada uma: o horário é desmarcado e a mensagem sai pronta no WhatsApp. Elas também ficam na tela Hoje até você avisar.</p>'+
       afet.map(x=>'<div class="cli"><span class="av">'+esc(iniciais(cl(x.cli).nome))+'</span><div class="q"><b>'+esc(cl(x.cli).nome)+'</b><small>'+x.hora+' · '+esc(sv(x.serv).nome)+'</small></div><button class="btn peq pri" data-act="avisarConflito" data-id="'+x.id+'">Avisar</button></div>').join('')+'<button class="btn cheio" data-act="fechar">Depois</button>');
     else aviso(descBloq(b)+' · '+rotDia(b.data).toLowerCase()+'. Ninguém estava marcada.');return}
   case'avisarConflito':{const c=cl(a.cli),b=S.bloqueios.find(y=>y.id===a.conflito);a.status='cancelado';a.conflito=null;desenhar();
     zap(c,'Oi, '+primeiro(c.nome)+'! Aqui é a Wylma 💜 '+(b?quandoFrase(b.data)+' '+fraseBloq(b)+', então precisei desmarcar seu horário das '+a.hora+'.':'Precisei desmarcar seu horário de '+rotDia(a.data).toLowerCase()+' às '+a.hora+'.')+' Me desculpe! Já escolhe outro horário pelo app.');return}
   case'tirarBloqueio':S.bloqueios=S.bloqueios.filter(b=>b.id!==id);S.ag.forEach(x=>{if(x.conflito===id)x.conflito=null});aviso('Horário liberado de novo.');break;
   case'expToggle':{const w=+el.dataset.w;EXP[w]=EXP[w]?null:(w===6?[480,960]:[540,1140]);break}
   case'editServ':{const s=id==='novo'?{nome:'',cat:CATS[0],min:60,preco:0,apartir:false,retorno:0,ativo:true}:sv(id);
     janela('<h3>'+(id==='novo'?'Novo serviço':'Editar serviço')+'</h3><div class="campo"><label for="esNome">Nome</label><input id="esNome" value="'+esc(s.nome)+'" placeholder="Ex.: Design de sobrancelhas"></div>'+
       '<div class="campo"><label for="esCat">Tipo</label><select id="esCat">'+CATS.map(c=>'<option'+(c===s.cat?' selected':'')+'>'+c+'</option>').join('')+'</select></div>'+
       '<div class="linha"><div class="campo" style="flex:1"><label for="esPreco">Preço (R$)</label><input id="esPreco" type="number" step="0.01" min="0" inputmode="decimal" value="'+s.preco+'"></div><div class="campo" style="flex:1"><label for="esMin">Duração</label><select id="esMin">'+[30,60,90,120,150,180,240].map(m=>'<option value="'+m+'"'+(m===s.min?' selected':'')+'>'+(m<60?m+' min':(m/60+'').replace('.',',')+' h')+'</option>').join('')+'</select></div></div>'+
       '<div class="campo"><label for="esRet">Lembrar de retocar depois de (dias)</label><input id="esRet" type="number" min="0" inputmode="numeric" value="'+(s.retorno||0)+'" placeholder="0 = não lembrar"></div>'+
       '<label class="marcar"><input type="checkbox" id="esApartir"'+(s.apartir?' checked':'')+'> Preço "a partir de" (você ajusta na hora de cobrar)</label><label class="marcar"><input type="checkbox" id="esAtivo"'+(s.ativo!==false?' checked':'')+'> Aparece para as clientes</label>'+
       '<button class="btn pri cheio" data-act="salvarServ" data-id="'+id+'">Salvar</button><button class="btn cheio" data-act="fechar">Voltar</button>');return}
   case'salvarServ':{const g=i=>document.getElementById(i),nome=g('esNome').value.trim();if(!nome){aviso('Dê um nome ao serviço.');return}
     const d={nome,cat:g('esCat').value,preco:Math.max(0,parseFloat(g('esPreco').value)||0),min:+g('esMin').value,retorno:Math.max(0,parseInt(g('esRet').value)||0),apartir:g('esApartir').checked,ativo:g('esAtivo').checked};
     if(id==='novo')SERV.push(Object.assign({id:'s'+Date.now()},d));else Object.assign(sv(id),d);fechar();aviso('Serviço salvo. Já aparece assim no app das clientes.');break}
   case'editPac':{const p=id==='novo'?{nome:'',serv:'clareamento',sessoes:4,preco:0}:pc(id);
     janela('<h3>'+(id==='novo'?'Novo pacote':'Editar pacote')+'</h3><div class="campo"><label for="epNome">Nome</label><input id="epNome" value="'+esc(p.nome)+'" placeholder="Ex.: Spa dos pés · 4 sessões"></div>'+
       '<div class="campo"><label for="epServ">Serviço</label><select id="epServ">'+servAtivos().map(s=>'<option value="'+s.id+'"'+(s.id===p.serv?' selected':'')+'>'+esc(s.nome)+'</option>').join('')+'</select></div>'+
       '<div class="linha"><div class="campo" style="flex:1"><label for="epSes">Sessões</label><input id="epSes" type="number" min="1" max="30" inputmode="numeric" value="'+p.sessoes+'"></div><div class="campo" style="flex:1"><label for="epPreco">Preço (R$)</label><input id="epPreco" type="number" step="0.01" min="0" inputmode="decimal" value="'+p.preco+'"></div></div>'+
       '<button class="btn pri cheio" data-act="salvarPac" data-id="'+id+'">Salvar</button><button class="btn cheio" data-act="fechar">Voltar</button>');return}
   case'salvarPac':{const g=i=>document.getElementById(i),nome=g('epNome').value.trim();if(!nome){aviso('Dê um nome ao pacote.');return}
     const d={nome,serv:g('epServ').value,sessoes:Math.max(1,parseInt(g('epSes').value)||1),preco:Math.max(0,parseFloat(g('epPreco').value)||0)};
     if(id==='novo')PACS.push(Object.assign({id:'p'+Date.now()},d));else Object.assign(pc(id),d);fechar();aviso('Pacote salvo.');break}
   case'editProf':{const b=id==='novo'?{nome:'',com:40}:pf(id);
     janela('<h3>'+(id==='novo'?'Nova profissional':'Editar profissional')+'</h3><div class="campo"><label for="ebNome">Nome</label><input id="ebNome" value="'+esc(b.nome)+'"></div><div class="campo"><label for="ebCom">Comissão (%)</label><input id="ebCom" type="number" min="0" max="100" inputmode="numeric" value="'+b.com+'"></div>'+
       '<button class="btn pri cheio" data-act="salvarProf" data-id="'+id+'">Salvar</button><button class="btn cheio" data-act="fechar">Voltar</button>');return}
   case'salvarProf':{const nome=document.getElementById('ebNome').value.trim(),com=Math.min(100,Math.max(0,parseInt(document.getElementById('ebCom').value)||0));if(!nome){aviso('Coloque o nome.');return}
     if(id==='novo')PROF.push({id:'b'+Date.now(),nome,com,cor:CORES_PROF[(PROF.length-2+CORES_PROF.length)%CORES_PROF.length]});else Object.assign(pf(id),{nome,com});fechar();aviso('Profissional salva.');break}
   default:return;
  }
  desenhar();
});
document.addEventListener('change',ev=>{const t=ev.target;
  if(t.dataset.foto&&t.files&&t.files[0]){lerFoto(t.files[0],url=>{fin[t.dataset.foto]=url;janelaFinalizar()});return}
  if(t.dataset.exp){const w=+t.dataset.w,p=+t.dataset.p;EXP[w][p]=+t.value;if(EXP[w][0]>=EXP[w][1]){if(p)EXP[w][0]=EXP[w][1]-PASSO;else EXP[w][1]=EXP[w][0]+PASSO;aviso('Ajustei: o fechamento precisa ser depois da abertura.')}desenhar();return}
  if(['bqData','bqProf','bqH1','bqH2'].includes(t.id)){lerBloq();janelaBloq()}
});
document.addEventListener('input',ev=>{
  if(ev.target.id==='busca'){S.busca=ev.target.value;const p=ev.target.selectionStart;desenhar();const b=document.getElementById('busca');b.focus();b.setSelectionRange(p,p)}
  if(ev.target.id==='fValor'&&fin){fin.valor=Math.max(0,parseFloat(ev.target.value)||0);const t=fin.valor+EXTRAS.reduce((s,x)=>s+(fin.extras[x.id]||0)*x.preco,0);const tb=camada.querySelector('.total b');if(tb)tb.textContent=brl(t);const ok=camada.querySelector('[data-act="fOk"]');if(ok){ok.textContent=t>0?'Recebi '+brl(t):'Concluir';ok.disabled=t>0&&!fin.forma}}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')fechar()});
document.getElementById('recomecar').addEventListener('click',()=>{try{localStorage.removeItem('wylma-demo1')}catch(e){}S=gerar();ligar();fechar();desenhar();window.scrollTo(0,0);aviso('Demonstração recomeçada.')});
desenhar();
})();
