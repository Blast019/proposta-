<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Archivo:wght@400;500;600;700;800&family=Archivo+Narrow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: app de celular numa coluna só (até 520px), com faixa de poste de barbeiro sob o cabeçalho e barra de abas fixa embaixo. Visual escuro de propósito: o preto e prata cromado da logo do Flavio Jr. */
:root{
  --bg:#0a0a0b; --sup:#141416; --sup2:#1c1c1f; --linha:#2d2d32;
  --creme:#eeeef0; --suave:#9b9ba3; --acento:#d3d6dc; --acento-esc:#80848c; --verde:#4aa36a; --verde-bg:#16291c;
  --ambar:#e7ad41; --ambar-bg:#1d1f24; --azul:#6fa8dc;
  --marca:"Cinzel","Trajan Pro","Times New Roman",serif;
  --corpo:"Archivo","Segoe UI",system-ui,sans-serif;
  --estreita:"Archivo Narrow","Arial Narrow","Segoe UI",sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--creme);font:15px/1.5 var(--corpo);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);border-inline:1px solid var(--linha)}
@media (max-width:540px){.app{border-inline:0}}

/* Cabeçalho */
.topo{padding:14px 16px 0;background:radial-gradient(120% 140% at 0% 0%,#202024 0%,var(--bg) 70%)}
.demo{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.demo small{font:600 11px/1 var(--estreita);letter-spacing:.14em;text-transform:uppercase;color:var(--suave)}
.troca{display:flex;background:var(--sup);border:1px solid var(--linha);border-radius:99px;padding:3px}
.troca button{border:0;background:none;padding:6px 12px;border-radius:99px;font:600 13px/1 var(--corpo);color:var(--suave)}
.troca button[aria-pressed="true"]{background:var(--creme);color:var(--bg)}
.marca{display:flex;align-items:center;gap:12px;padding-bottom:12px}
.marca .logo{width:64px;height:64px;border-radius:14px;border:1px solid #3a3a40;box-shadow:0 4px 14px rgba(0,0,0,.5);flex:none}
.marca .t{font:600 30px/1 var(--marca);letter-spacing:2px;background:linear-gradient(180deg,#ffffff 0%,#a7abb2 55%,#e9eaed 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.marca .s{display:flex;flex-direction:column;gap:2px;font:600 12px/1.1 var(--estreita);letter-spacing:.16em;text-transform:uppercase;color:var(--suave)}
.marca .s b{color:var(--creme);font-weight:700}
.poste{height:2px;background:linear-gradient(90deg,transparent,#d3d6dc 30%,#ffffff 50%,#d3d6dc 70%,transparent)}

main{flex:1;padding:18px 16px 24px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font:800 26px/1.1 var(--corpo);letter-spacing:-.4px}
h2{font:700 13px/1 var(--estreita);letter-spacing:.14em;text-transform:uppercase;color:var(--suave)}
p{margin:0}
.suave{color:var(--suave)}
.bloco{display:flex;flex-direction:column;gap:10px}
.cartao{background:var(--sup);border:1px solid var(--linha);border-radius:14px;padding:14px}
.linha{display:flex;align-items:center;gap:10px;justify-content:space-between}
.num{font-variant-numeric:tabular-nums}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--linha);background:var(--sup2);border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px;line-height:1}
.btn.pri{background:linear-gradient(180deg,#f4f5f7,#b9bdc4);border-color:#d3d6dc;color:#0a0a0b}
.btn.verde{background:var(--verde);border-color:var(--verde);color:#0d1f13}
.btn.cheio{width:100%;padding:14px}
.btn.peq{padding:7px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.acoes{display:flex;flex-wrap:wrap;gap:8px}

/* Chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--linha);background:var(--sup);border-radius:99px;padding:8px 13px;font-weight:600;font-size:13.5px;line-height:1;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--creme);color:var(--bg);border-color:var(--creme)}

/* Situação */
.st{display:inline-flex;align-items:center;gap:6px;font:700 11.5px/1 var(--estreita);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:99px;white-space:nowrap}
.st.agendado{border:1px solid var(--linha);color:var(--suave)}
.st.chegou{background:var(--ambar-bg);color:var(--ambar)}
.st.atendendo{background:var(--acento);color:#0a0a0b}
.st.pago{background:var(--verde-bg);color:var(--verde)}
.st.faltou,.st.cancelado{color:var(--suave);text-decoration:line-through}
.st.clube{background:#2a2140;color:#c7b4ff}
.st.atraso{background:var(--ambar-bg);color:var(--ambar)}

/* Cliente: início */
.saud .ola{font:600 26px/1.1 var(--marca);letter-spacing:1px;color:var(--creme)}
.prox{background:linear-gradient(160deg,#222226,var(--sup) 60%);border:1px solid var(--linha);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.prox .quando{font:800 30px/1 var(--corpo);letter-spacing:-.5px}
.prox .quando span{font:600 15px/1 var(--estreita);color:var(--suave);letter-spacing:.04em;margin-left:6px}
.selos{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:4px}
.selo{aspect-ratio:1;border-radius:50%;border:1.5px dashed var(--linha);display:grid;place-items:center}
.selo.ok{border:0;background:radial-gradient(circle at 35% 30%,#ffffff,#c4c7cd 50%,#6f737a)}
.selo.ok::after{content:"";width:46%;height:16%;border-radius:0 0 50% 50%/0 0 100% 100%;background:#0a0a0b;opacity:.75}
.selo.gratis{border:1.5px solid var(--creme);font:700 9px/1 var(--estreita);letter-spacing:.04em}
.clube{border:1px solid #4b3a78;background:linear-gradient(160deg,#241c38,var(--sup) 70%)}
.barra{height:8px;background:var(--sup2);border-radius:99px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--acento);border-radius:99px}

/* Agendar */
.lista{display:flex;flex-direction:column;gap:8px}
.op{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;width:100%;background:var(--sup);border:1px solid var(--linha);border-radius:12px;padding:12px 14px}
.op[aria-pressed="true"]{border-color:var(--acento);box-shadow:inset 0 0 0 1px var(--acento)}
.op b{display:block;font-size:15px}
.op small{color:var(--suave);font-size:13px}
.op .preco{font:700 16px/1 var(--estreita);white-space:nowrap}
.horas{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hora{border:1px solid var(--linha);background:var(--sup);border-radius:10px;padding:11px 0;font:700 15px/1 var(--estreita);font-variant-numeric:tabular-nums}
.hora[aria-pressed="true"]{background:var(--acento);border-color:var(--acento);color:#0a0a0b}
.dia{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:58px;padding:9px 10px;border-radius:12px}
.dia small{font:600 11px/1 var(--estreita);letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.dia b{font:800 19px/1 var(--corpo)}
.resumo{position:sticky;bottom:72px;background:var(--sup2);border:1px solid var(--linha);border-radius:14px;padding:12px;display:flex;gap:12px;align-items:center;justify-content:space-between;box-shadow:0 -10px 30px rgba(0,0,0,.4)}
.resumo p{font-size:13.5px;line-height:1.35;min-width:0}

/* Dono: hoje */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--sup);border:1px solid var(--linha);border-radius:12px;padding:12px 10px}
.kpi small{display:block;font:600 11px/1.2 var(--estreita);letter-spacing:.1em;text-transform:uppercase;color:var(--suave)}
.kpi b{display:block;font:800 21px/1.15 var(--corpo);font-variant-numeric:tabular-nums;margin-top:6px}
.aviso{display:flex;gap:10px;align-items:flex-start;background:var(--ambar-bg);border:1px solid #33363d;border-left:3px solid var(--acento);border-radius:12px;padding:11px 12px;color:var(--creme);font-size:14px}
.aviso .x{margin-left:auto;background:none;border:0;color:var(--acento);font-weight:700;font-size:13px}
.fila{display:flex;flex-direction:column;gap:8px}
.at{display:grid;grid-template-columns:54px 1fr;gap:12px;background:var(--sup);border:1px solid var(--linha);border-radius:12px;padding:12px}
.at.feito{opacity:.62}
.at .h{font:700 17px/1 var(--estreita);font-variant-numeric:tabular-nums;padding-top:2px}
.at .h small{display:block;font-size:12px;color:var(--suave);margin-top:4px;font-weight:600}
.at .q{display:flex;flex-direction:column;gap:6px;min-width:0}
.at .q b{font-size:15.5px}
.at .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--suave)}
.barb{display:inline-flex;align-items:center;gap:6px}
.barb i{width:8px;height:8px;border-radius:50%}

/* Agenda grade */
.grade{display:grid;gap:4px;align-items:stretch}
.grade .hh{font:600 12px/1 var(--estreita);color:var(--suave);padding-top:6px;font-variant-numeric:tabular-nums}
.grade .cab{font:700 13px/1 var(--estreita);letter-spacing:.08em;text-transform:uppercase;text-align:center;padding:6px 0}
.livre{border:1px dashed var(--linha);border-radius:8px;background:none;color:var(--suave);font-size:12px;min-height:40px}
.livre:hover{border-color:var(--acento);color:var(--creme)}
.bloc{border-radius:8px;padding:6px 8px;background:var(--sup2);border-left:3px solid var(--creme);font-size:12.5px;line-height:1.25;overflow:hidden;min-height:40px;text-align:left;border-top:0;border-right:0;border-bottom:0}
.bloc b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bloc.pago{border-left-color:var(--verde)}.bloc.atendendo{border-left-color:var(--acento)}.bloc.chegou{border-left-color:var(--ambar)}

/* Caixa */
.barras{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:6px}
.barras i{flex:1;background:var(--acento);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.barras i.hoje{background:var(--creme)}
.tab{width:100%;border-collapse:collapse;font-size:14px}
.tab td{padding:9px 0;border-bottom:1px solid var(--linha)}
.tab td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.tab tr:last-child td{border-bottom:0}

/* Clientes */
.busca{width:100%;background:var(--sup);border:1px solid var(--linha);border-radius:12px;padding:12px 14px;color:var(--creme);font:inherit}
.cli{display:flex;align-items:center;gap:12px;background:var(--sup);border:1px solid var(--linha);border-radius:12px;padding:11px 12px}
.av{flex:none;width:38px;height:38px;border-radius:50%;background:var(--sup2);display:grid;place-items:center;font:700 15px/1 var(--estreita);color:var(--creme);border:1px solid var(--linha)}
.cli .q{flex:1;min-width:0}
.cli .q b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cli .q small{color:var(--suave);font-size:13px}

/* Abas */
.abas{position:sticky;bottom:0;display:grid;background:rgba(10,10,11,.96);backdrop-filter:blur(8px);border-top:1px solid var(--linha);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.abas button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;font:600 11.5px/1 var(--corpo);color:var(--suave);border-radius:10px}
.abas button svg{width:22px;height:22px}
.abas button[aria-current="page"]{color:var(--creme)}
.abas button[aria-current="page"] svg{color:var(--acento)}

/* Janela */
.fundo-modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:0}
.modal{width:100%;max-width:520px;max-height:88vh;overflow:auto;background:var(--sup);border:1px solid var(--linha);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.modal h3{font:800 20px/1.15 var(--corpo)}
.zap{background:#0b141a;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.zap .bal{align-self:flex-end;background:#005c4b;color:#e9edef;border-radius:10px 10px 2px 10px;padding:9px 11px;font-size:14px;max-width:92%;white-space:pre-wrap}
.campo{display:flex;flex-direction:column;gap:6px}
.campo label{font:600 12px/1 var(--estreita);letter-spacing:.1em;text-transform:uppercase;color:var(--suave)}
.campo select,.campo input{background:var(--sup2);border:1px solid var(--linha);border-radius:10px;padding:11px 12px;color:var(--creme);font:inherit}
.qtd{display:flex;align-items:center;gap:10px}
.qtd button{width:32px;height:32px;border-radius:8px;border:1px solid var(--linha);background:var(--sup2);font-weight:700}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--linha);padding-top:12px}
.total b{font:800 28px/1 var(--corpo);font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--creme);color:var(--bg);font-weight:700;font-size:14px;padding:11px 16px;border-radius:12px;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:calc(100% - 32px);text-align:center}
.rodape{font-size:12px;color:var(--suave);text-align:center;padding:4px 16px 14px}
.rodape button{background:none;border:0;color:var(--suave);text-decoration:underline;font-size:12px}
.bloqueado{border-radius:8px;min-height:40px;display:grid;place-items:center;font-size:11.5px;color:var(--suave);background:repeating-linear-gradient(-45deg,var(--sup) 0 6px,var(--sup2) 6px 12px)}
.marcar{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.35}
.marcar input{width:20px;height:20px;accent-color:var(--acento);flex:none;margin:0}
.hsel{background:var(--sup2);border:1px solid var(--linha);border-radius:8px;padding:6px 4px;color:var(--creme);font:600 14px/1 var(--estreita);font-variant-numeric:tabular-nums}
.tab td:first-child{text-align:left}
.vazio{text-align:center;color:var(--suave);padding:20px 10px;border:1px dashed var(--linha);border-radius:12px}
@media (prefers-reduced-motion:no-preference){.st.atendendo{animation:pulsa 1.6s ease-in-out infinite}}
@keyframes pulsa{50%{opacity:.65}}
</style>
</head>

  if(!dias.includes(blq.data))blq.data=dias[0];

  if(blq.h1==null||blq.h1<e[0]||blq.h1>e[1])blq.h1=Math.min(e[0]+180,e[1]-PASSO);
  if(blq.h2==null||blq.h2<=blq.h1||blq.h2>e[1])blq.h2=Math.min(blq.h1+120,e[1]);
  const T=blq.tipo;
  janela('<h3>Mudar horário</h3><p class="suave" style="font-size:13.5px">Os horários bloqueados somem do app dos clientes na hora.</p>'+
    '<div class="campo"><label for="bqData">Dia</label><select id="bqData">'+dias.map(d=>'<option value="'+d+'"'+(d===blq.data?' selected':'')+'>'+rotDia(d)+(d===HOJE||rotDia(d)==='Amanhã'?' ('+dataCurta(d)+')':'')+'</option>').join('')+'</select></div>'+
    '<div class="campo"><label for="bqBarb">Quem</label><select id="bqBarb"><option value="todos">Barbearia toda</option>'+BARB.map(b=>'<option value="'+b.id+'"'+(blq.barb===b.id?' selected':'')+'>Só '+esc(b.nome)+'</option>').join('')+'</select></div>'+
    '<div class="campo"><label>O que muda</label><div class="chips" style="flex-wrap:wrap">'+[['dia','Não vou atender'],['apos','Só a partir de…'],['ate','Só até…'],['faixa','Fechar um intervalo']].map(([id,n])=>'<button class="chip" aria-pressed="'+(T===id)+'" data-act="bqTipo" data-id="'+id+'">'+n+'</button>').join('')+'</div></div>'+
    (T==='apos'?'<div class="campo"><label for="bqH1">Começo a atender às</label><select id="bqH1">'+opHoras(blq.h1,e[0]+PASSO,e[1]-PASSO)+'</select></div>':'')+
    (T==='ate'?'<div class="campo"><label for="bqH1">Atendo até as</label><select id="bqH1">'+opHoras(blq.h1,e[0]+PASSO,e[1]-PASSO)+'</select></div>':'')+
    (T==='faixa'?'<div class="linha" style="gap:10px"><div class="campo" style="flex:1"><label for="bqH1">De</label><select id="bqH1">'+opHoras(blq.h1,e[0],e[1]-PASSO)+'</select></div><div class="campo" style="flex:1"><label for="bqH2">Até</label><select id="bqH2">'+opHoras(blq.h2,e[0]+PASSO,e[1])+'</select></div></div>':'')+
    '<div class="campo"><label>Motivo (só você vê)</label><div class="chips" style="flex-wrap:wrap">'+['Imprevisto','Médico','Folga','Feriado','Curso'].map(m=>'<button class="chip" aria-pressed="'+(blq.motivo===m)+'" data-act="bqMotivo" data-id="'+m+'">'+m+'</button>').join('')+'</div></div>'+
    '<button class="btn pri cheio" data-act="bqOk">Bloquear</button><button class="btn cheio" data-act="fechar">Voltar</button>');
}
function fraseBloq(b){return{dia:'não vou abrir',apos:'só vou atender a partir das '+paraHora(b.fim),ate:'só vou atender até as '+paraHora(b.ini),faixa:'não vou atender das '+paraHora(b.ini)+' às '+paraHora(b.fim)}[b.tipo]}
function quandoFrase(data){const r=rotDia(data);return r==='Hoje'||r==='Amanhã'?r:'No dia '+dataCurta(data)}

/* ---------- janelas ---------- */
function janela(html){camada.innerHTML='<div class="fundo-modal" data-act="fechar"><div class="modal" role="dialog" aria-modal="true">'+html+'</div></div>';const b=camada.querySelector('.modal button');if(b)b.focus()}
function fechar(){camada.innerHTML=''}
function aviso(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
function zap(c,txt){janela('<h3>Mensagem para '+esc(c.nome.split(' ')[0])+'</h3><p class="suave" style="font-size:13.5px">No app de verdade, este botão abre o WhatsApp de '+esc(c.fone)+' com a mensagem pronta. É só tocar em enviar.</p><div class="zap"><div class="bal">'+esc(txt)+'</div></div><button class="btn cheio" data-act="fechar">Fechar</button>')}

let fin=null;
function janelaFinalizar(){
  const a=S.ag.find(x=>x.id===fin.id),c=cl(a.cli),s=sv(a.serv);
  const resta=clubeResta(c.id,a.data)+(a.clube?1:0),podeClube=c.clube&&s.clube&&resta>0;
  const base=fin.clube?0:fin.valor,ext=EXTRAS.reduce((t,x)=>t+(fin.extras[x.id]||0)*x.preco,0),tot=base+ext;
  janela('<h3>Finalizar · '+esc(c.nome)+'</h3>'+
    '<div class="campo"><label for="fValor">'+s.nome+(s.apartir?' (a partir de '+brl(s.preco)+')':'')+(c.clube&&!s.clube&&CLUBE.desconto?' · já com '+CLUBE.desconto+'% do Clube':'')+'</label>'+(fin.clube?'<p><span class="st clube">Pelo Clube · sem cobrança</span></p>':'<input id="fValor" type="number" step="0.01" inputmode="decimal" value="'+fin.valor+'">')+'</div>'+
    (podeClube?'<button class="btn peq" data-act="fClube">'+(fin.clube?'Cobrar normal':'Usar corte do Clube ('+resta+(resta===1?' restante':' restantes')+')')+'</button>':'')+
    '<div class="campo"><label>Vendeu mais alguma coisa?</label>'+EXTRAS.map(x=>'<div class="linha"><span>'+x.nome+' <span class="suave">'+brl(x.preco)+'</span></span><span class="qtd"><button data-act="fExtra" data-id="'+x.id+'" data-d="-1" aria-label="Menos">−</button><b class="num">'+(fin.extras[x.id]||0)+'</b><button data-act="fExtra" data-id="'+x.id+'" data-d="1" aria-label="Mais">+</button></span></div>').join('')+'</div>'+
    (tot>0?'<div class="campo"><label>Forma de pagamento</label><div class="chips">'+['Pix','Dinheiro','Débito','Crédito'].map(f=>'<button class="chip" aria-pressed="'+(fin.forma===f)+'" data-act="fForma" data-id="'+f+'">'+f+'</button>').join('')+'</div></div>':'')+
    '<div class="total"><span class="suave">Total</span><b>'+brl(tot)+'</b></div>'+
    '<button class="btn verde cheio" data-act="fOk"'+(tot>0&&!fin.forma?' disabled':'')+'>'+(tot>0?'Recebi '+brl(tot):'Concluir sem cobrança')+'</button>');
}

/* ---------- ações ---------- */
document.addEventListener('click',ev=>{
  const m=ev.target.closest('[data-modo]');if(m){S.modo=m.dataset.modo;fechar();desenhar();window.scrollTo(0,0);return}
  const ab=ev.target.closest('[data-aba]');if(ab){S.aba[S.modo]=ab.dataset.aba;if(ab.dataset.aba==='agendar'&&!S.fluxo.remarca&&!S.fluxo.serv&&cl(S.eu).clube)S.fluxo.serv='combo';fechar();desenhar();window.scrollTo(0,0);return}
  const el=ev.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act,id=el.dataset.id,F=S.fluxo;
  if(act==='fechar'){if(el.classList.contains('fundo-modal')&&ev.target!==el)return;fechar();return}
  const a=id?S.ag.find(x=>x.id===id):null;
  switch(act){
   case'escolherServ':S.fluxo={serv:id,barb:'qualquer',data:null,hora:null,remarca:null};S.aba.cliente='agendar';break;
   case'fServ':F.serv=id;F.hora=null;break;
   case'fBarb':F.barb=id;F.hora=null;break;
   case'fDia':F.data=id;F.hora=null;break;
   case'fHora':F.hora=id;F.barbEsc=el.dataset.b;break;
   case'confirmar':{
     const s=sv(F.serv),eu=cl(S.eu),x0=F.remarca?S.ag.find(y=>y.id===F.remarca):null;
     if(x0)x0.clube=false;
     const pc=eu.clube&&s.clube&&clubeResta(S.eu,F.data)>0,preco=pc?0:precoPara(eu,s);
     if(F.remarca){const x=x0;const antes=rotDia(x.data).toLowerCase()+' '+x.hora;Object.assign(x,{serv:F.serv,barb:F.barbEsc,data:F.data,hora:F.hora,clube:pc,valor:preco,atraso:0,conflito:null});
       S.avisos.unshift({id:'v'+Date.now(),txt:eu.nome+' remarcou pelo app: de '+antes+' para '+rotDia(F.data).toLowerCase()+' às '+F.hora});}
     else{S.ag.push({id:'a'+(S.seq++),cli:S.eu,serv:F.serv,barb:F.barbEsc,data:F.data,hora:F.hora,status:'agendado',valor:preco,clube:pc,extras:{},atraso:0,origem:'app'});
       S.avisos.unshift({id:'v'+Date.now(),txt:eu.nome+' agendou pelo app: '+s.nome+', '+rotDia(F.data).toLowerCase()+' às '+F.hora+' com '+bb(F.barbEsc).nome});}
     const msg=(F.remarca?'Remarcado':'Agendado')+': '+rotDia(F.data).toLowerCase()+' às '+F.hora;
     S.fluxo={serv:null,barb:'qualquer',data:null,hora:null,remarca:null};S.aba.cliente='inicio';desenhar();window.scrollTo(0,0);aviso(msg+'. A barbearia já foi avisada.');return}
   case'remarcar':S.fluxo={serv:a.serv,barb:a.barb,data:a.data,hora:null,remarca:a.id};S.aba.cliente='agendar';break;
   case'cancelar':janela('<h3>Cancelar o horário?</h3><p>'+sv(a.serv).nome+', '+rotDia(a.data).toLowerCase()+' às '+a.hora+'.</p><div class="campo"><label>Motivo</label><div class="chips">'+['Imprevisto','Trabalho','Vou remarcar depois'].map(t=>'<button class="chip" data-act="cancelarOk" data-id="'+a.id+'" data-m="'+t+'">'+t+'</button>').join('')+'</div></div><button class="btn cheio" data-act="fechar">Manter horário</button>');return;
   case'cancelarOk':a.status='cancelado';S.avisos.unshift({id:'v'+Date.now(),txt:cl(a.cli).nome+' cancelou '+rotDia(a.data).toLowerCase()+' às '+a.hora+' ('+el.dataset.m.toLowerCase()+'). O horário ficou livre.'});fechar();aviso('Horário cancelado. A vaga foi liberada.');break;
   case'atrasar':janela('<h3>Quanto vai atrasar?</h3><div class="acoes">'+[10,15,20].map(n=>'<button class="btn" data-act="atrasoOk" data-id="'+a.id+'" data-n="'+n+'">'+n+' min</button>').join('')+'</div><button class="btn cheio" data-act="fechar">Voltar</button>');return;
   case'atrasoOk':a.atraso=+el.dataset.n;S.avisos.unshift({id:'v'+Date.now(),txt:cl(a.cli).nome+' avisou que vai atrasar '+a.atraso+' min ('+rotDia(a.data).toLowerCase()+', '+a.hora+')'});fechar();aviso('Avisamos o '+bb(a.barb).nome+'.');break;
   case'entrarClube':cl(S.eu).clube=true;cl(S.eu).clubePago=false;cl(S.eu).clubeDia=Math.min(28,hojeD().getDate());S.avisos.unshift({id:'v'+Date.now(),txt:cl(S.eu).nome+' pediu para entrar no Clube'});aviso('Pedido enviado. A barbearia confirma quando receber a 1ª mensalidade.');break;
   case'okAviso':S.avisos=S.avisos.filter(v=>v.id!==id);break;
   case'filtroBarb':S.filtroBarb=id;break;
   case'status':a.status=el.dataset.st;if(a.status==='atendendo')a.atraso=0;break;
   case'finalizar':fin={id:a.id,valor:a.clube?precoPara(cl(a.cli),sv(a.serv)):a.valor,clube:a.clube,extras:Object.assign({},a.extras),forma:null};janelaFinalizar();return;
   case'fClube':fin.clube=!fin.clube;janelaFinalizar();return;
   case'fExtra':fin.extras[id]=Math.max(0,(fin.extras[id]||0)+(+el.dataset.d));janelaFinalizar();return;
   case'fForma':fin.forma=id;janelaFinalizar();return;
   case'fOk':{const x=S.ag.find(y=>y.id===fin.id);const base=fin.clube?0:fin.valor,ext=EXTRAS.reduce((t,e)=>t+(fin.extras[e.id]||0)*e.preco,0);
     Object.assign(x,{status:'pago',clube:fin.clube,valor:base,extras:fin.extras,forma:base+ext>0?fin.forma:'Clube'});fechar();
     const c=cl(x.cli),n=selos(c.id);aviso(base+ext>0?'Recebido '+brl(base+ext)+'. '+c.nome.split(' ')[0]+' ganhou um selo ('+n+'/10).':'Corte do Clube registrado.');break}
   case'diaAgenda':S.diaAgenda=id;break;
   case'verAg':{const c=cl(a.cli);janela('<h3>'+esc(c.nome)+'</h3><p>'+sv(a.serv).nome+' · '+rotDia(a.data)+' às '+a.hora+' com '+bb(a.barb).nome+'</p><div class="meta acoes">'+st(a.status)+(a.clube?'<span class="st clube">Clube</span>':'')+'<span class="suave">'+(a.origem==='app'?'Marcou pelo app':'Marcado na barbearia')+'</span></div>'+
     (a.status==='agendado'?'<button class="btn cheio" data-act="zapLembrete" data-id="'+a.id+'">Mandar lembrete no WhatsApp</button><button class="btn cheio" data-act="desmarcar" data-id="'+a.id+'">Desmarcar (avisa o cliente)</button>':'')+'<button class="btn cheio" data-act="fechar">Fechar</button>');return}
   case'zapLembrete':{const c=cl(a.cli);zap(c,'Fala, '+c.nome.split(' ')[0]+'! 💈 Passando pra lembrar do seu horário na barbearia Flavio Jr '+rotDia(a.data).toLowerCase()+' às '+a.hora+' com o '+bb(a.barb).nome+'. Confirma pra mim? ✂️');return}
   case'desmarcar':{const c=cl(a.cli);a.status='cancelado';desenhar();zap(c,'Fala, '+c.nome.split(' ')[0]+'! Tive um imprevisto e precisei desmarcar seu horário de '+rotDia(a.data).toLowerCase()+' às '+a.hora+'. Foi mal! Já escolhe outro horário pelo app, que tem vaga essa semana 💈');return}
   case'novoBalcao':{const b=el.dataset.b,h=el.dataset.h;janela('<h3>Marcar '+rotDia(S.diaAgenda).toLowerCase()+' às '+h+'</h3><p class="suave">Com '+bb(b).nome+'. Para o cliente que ligou ou mandou mensagem.</p>'+
     '<div class="campo"><label for="nbCli">Cliente</label><select id="nbCli">'+S.clientes.slice().sort((x,y)=>x.nome.localeCompare(y.nome)).map(c=>'<option value="'+c.id+'">'+esc(c.nome)+(c.clube?' (Clube)':'')+'</option>').join('')+'</select></div>'+
     '<div class="campo"><label for="nbServ">Serviço</label><select id="nbServ">'+servAtivos().map(s=>'<option value="'+s.id+'">'+s.nome+' · '+s.min+' min</option>').join('')+'</select></div>'+
     '<button class="btn pri cheio" data-act="novoBalcaoOk" data-b="'+b+'" data-h="'+h+'">Marcar horário</button><button class="btn cheio" data-act="fechar">Voltar</button>');return}
   case'novoBalcaoOk':{const cid=document.getElementById('nbCli').value,s=sv(document.getElementById('nbServ').value),b=el.dataset.b,h=el.dataset.h,c=cl(cid);
     if(!livre(b,S.diaAgenda,paraMin(h),s.min)){aviso(s.nome+' leva '+s.min+' min e não cabe nesse horário.');return}
     const pc=c.clube&&s.clube&&clubeResta(cid,S.diaAgenda)>0;
     S.ag.push({id:'a'+(S.seq++),cli:cid,serv:s.id,barb:b,data:S.diaAgenda,hora:h,status:'agendado',valor:pc?0:precoPara(c,s),clube:pc,extras:{},atraso:0,origem:'balcao'});
     desenhar();zap(c,'Fala, '+c.nome.split(' ')[0]+'! Tá marcado: '+s.nome+' '+rotDia(S.diaAgenda).toLowerCase()+' às '+h+' com o '+bb(b).nome+' 💈 Qualquer coisa, remarca pelo app.');return}
   case'filtroCli':S.filtroCli=id;break;
   case'zapCliente':{const c=cl(id),u=ultimo(id);zap(c,u&&diasDesde(u)>30?'Fala, '+c.nome.split(' ')[0]+'! Faz '+diasDesde(u)+' dias do seu último corte aqui na barbearia Flavio Jr 💈 Bora dar um tapa no visual? Tem horário essa semana, é só escolher no app.':'Fala, '+c.nome.split(' ')[0]+'! Tudo certo? 💈');return}
   case'recebiClube':{const c=cl(id);c.clubePago=true;aviso('Mensalidade de '+c.nome.split(' ')[0]+' recebida.');break}
   case'cobrarClube':{const c=cl(id);zap(c,'Fala, '+c.nome.split(' ')[0]+'! A mensalidade do Clube Flavio Jr ('+brl(CLUBE.preco)+') venceu dia '+c.clubeDia+'. Me manda o Pix pra continuar com os '+CLUBE.cortes+' cortes do mês 💈');return}
   case'periodo':S.periodo=id;break;
   /* folgas e imprevistos */
   case'novoBloqueio':blq={data:HOJE,barb:'todos',tipo:'apos',h1:null,h2:null,motivo:'Imprevisto'};janelaBloq();return;
   case'bqTipo':lerBloq();blq.tipo=id;janelaBloq();return;
   case'bqMotivo':lerBloq();blq.motivo=id;janelaBloq();return;
   case'bqOk':{lerBloq();const e=expediente(deYmd(blq.data));let ini,fim;
     if(blq.tipo==='dia'){ini=e[0];fim=e[1]}else if(blq.tipo==='apos'){ini=e[0];fim=blq.h1}else if(blq.tipo==='ate'){ini=blq.h1;fim=e[1]}else{ini=blq.h1;fim=blq.h2}
     if(!(ini<fim)){aviso('O fim precisa ser depois do começo.');return}
     const b={id:'b'+Date.now(),data:blq.data,barb:blq.barb,ini,fim,tipo:blq.tipo,diaTodo:blq.tipo==='dia',motivo:blq.motivo};S.bloqueios.push(b);
     const afet=S.ag.filter(x=>x.data===b.data&&x.status==='agendado'&&(b.barb==='todos'||x.barb===b.barb)&&paraMin(x.hora)<fim&&ini<paraMin(x.hora)+sv(x.serv).min);
     afet.forEach(x=>x.conflito=b.id);fechar();desenhar();
     if(afet.length)janela('<h3>Bloqueado. '+afet.length+(afet.length===1?' cliente estava marcado':' clientes estavam marcados')+'</h3><p class="suave" style="font-size:13.5px">Avise cada um. O horário é desmarcado e a mensagem sai pronta no WhatsApp. Eles também ficam na tela Hoje até você avisar.</p>'+
       afet.map(x=>'<div class="cli"><span class="av">'+iniciais(cl(x.cli).nome)+'</span><div class="q"><b>'+esc(cl(x.cli).nome)+'</b><small>'+x.hora+' · '+sv(x.serv).nome+' · '+bb(x.barb).nome+'</small></div><button class="btn peq pri" data-act="avisarConflito" data-id="'+x.id+'">Avisar</button></div>').join('')+'<button class="btn cheio" data-act="fechar">Depois</button>');
     else aviso(descBloq(b)+' · '+rotDia(b.data).toLowerCase()+'. Ninguém estava marcado.');
     return}
   case'avisarConflito':{const c=cl(a.cli),b=S.bloqueios.find(y=>y.id===a.conflito);a.status='cancelado';a.conflito=null;desenhar();
     zap(c,'Fala, '+c.nome.split(' ')[0]+'! Aqui é o Flavio, da barbearia Flavio Jr 💈 '+(b?quandoFrase(b.data)+' '+fraseBloq(b)+', então precisei desmarcar seu horário das '+a.hora+'.':'Precisei desmarcar seu horário de '+rotDia(a.data).toLowerCase()+' às '+a.hora+'.')+' Foi mal! Já escolhe outro horário pelo app ✂️');return}
   case'tirarBloqueio':S.bloqueios=S.bloqueios.filter(b=>b.id!==id);S.ag.forEach(x=>{if(x.conflito===id)x.conflito=null});aviso('Horário liberado de novo.');break;
   /* horário de funcionamento */
   case'expToggle':{const w=+el.dataset.w;EXP[w]=EXP[w]?null:(w===6?[480,1020]:[540,1200]);break}
   /* serviços */
   case'editServ':janelaServ(id);return;
   case'salvarServ':{const nome=document.getElementById('esNome').value.trim(),preco=Math.max(0,parseFloat(document.getElementById('esPreco').value)||0);
     if(!nome){aviso('Dê um nome ao serviço.');return}
     const dados={nome,preco,min:+document.getElementById('esMin').value,apartir:document.getElementById('esApartir').checked,clube:document.getElementById('esClube').checked,ativo:document.getElementById('esAtivo').checked};
     if(id==='novo')SERV.push(Object.assign({id:'s'+Date.now()},dados));else Object.assign(sv(id),dados);
     fechar();aviso('Serviço salvo. Já aparece assim no app dos clientes.');break}
   /* Clube */
   case'acumula':CLUBE.acumula=id==='1';break;
   case'salvarClube':CLUBE.preco=Math.max(0,parseFloat(document.getElementById('cbPreco').value)||0);CLUBE.cortes=Math.max(1,parseInt(document.getElementById('cbCortes').value)||1);
     CLUBE.desconto=Math.min(100,Math.max(0,parseInt(document.getElementById('cbDesc').value)||0));aviso('Clube atualizado.');break;
   /* barbeiros */
   case'editBarb':janelaBarb(id);return;
   case'salvarBarb':{const nome=document.getElementById('ebNome').value.trim(),com=Math.min(100,Math.max(0,parseInt(document.getElementById('ebCom').value)||0));
     if(!nome){aviso('Coloque o nome do barbeiro.');return}
     if(id==='novo')BARB.push({id:'b'+Date.now(),nome,com,cor:CORES_BARB[(BARB.length-2)%CORES_BARB.length]});else Object.assign(bb(id),{nome,com});
     fechar();aviso('Barbeiro salvo.');break}
   default:return;
  }
  desenhar();
});
document.addEventListener('input',ev=>{
  if(ev.target.id==='busca'){S.busca=ev.target.value;const p=ev.target.selectionStart;desenhar();const b=document.getElementById('busca');b.focus();b.setSelectionRange(p,p)}
  if(ev.target.id==='fValor'&&fin){fin.valor=Math.max(0,parseFloat(ev.target.value)||0);const t=fin.valor+EXTRAS.reduce((s,x)=>s+(fin.extras[x.id]||0)*x.preco,0);const tb=camada.querySelector('.total b');if(tb)tb.textContent=brl(t);const ok=camada.querySelector('[data-act="fOk"]');if(ok){ok.textContent=t>0?'Recebi '+brl(t):'Concluir sem cobrança';ok.disabled=t>0&&!fin.forma}}
});
function lerBloq(){const g=id=>document.getElementById(id);if(!blq)return;
  if(g('bqData'))blq.data=g('bqData').value;if(g('bqBarb'))blq.barb=g('bqBarb').value;
  if(g('bqH1'))blq.h1=+g('bqH1').value;if(g('bqH2'))blq.h2=+g('bqH2').value}
document.addEventListener('change',ev=>{const t=ev.target;
  if(t.dataset.exp){const w=+t.dataset.w,p=+t.dataset.p;EXP[w][p]=+t.value;
    if(EXP[w][0]>=EXP[w][1]){if(p)EXP[w][0]=EXP[w][1]-PASSO;else EXP[w][1]=EXP[w][0]+PASSO;aviso('Ajustei: o fechamento precisa ser depois da abertura.')}
    desenhar();return}
  if(t.id==='bqData'||t.id==='bqBarb'||t.id==='bqH1'||t.id==='bqH2'){lerBloq();janelaBloq()}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')fechar()});
document.getElementById('recomecar').addEventListener('click',()=>{try{localStorage.removeItem('flavio-demo1')}catch(e){}S=gerar();ligar();fechar();desenhar();window.scrollTo(0,0);aviso('Demonstração recomeçada.')});
desenhar();
})();
</script>
